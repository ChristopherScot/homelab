# Node / workload alert rules (provisioned as code; were UI-only before the
# SQLite->Postgres migration). UIDs preserved from the originals.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: nodes
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: local
  folderRef: monitoring
  interval: 60s
  rules:
    - uid: bfmla7jjzcdtsacr
      title: Node root disk almost full
      condition: B
      for: 10m
      noDataState: OK
      execErrState: OK
      labels: { component: nodes, severity: warning }
      annotations:
        summary: 'Node {{ $labels.instance }} root disk is {{ printf "%.0f" $values.A.Value }}% full'
        description: "The root filesystem (/) on node {{ $labels.instance }} has been over 85% full for 10m. A full root disk causes kubelet DiskPressure evictions and can wedge the node. Free space or expand. Check `df -h /` on the node. Note: pop-os runs warmer (it is also a desktop)."
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: grafanacloud-prom
          model: { expr: '100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100)', instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [85] }
    # Alerts on the STATE, not a restart rate.
    #
    # This used to be `increase(restarts_total[15m]) > 3`, which only
    # catches the opening burst. CrashLoopBackOff caps its retry at 5
    # minutes, so a container stuck in steady-state backoff restarts about
    # 3 times per 15m - sitting exactly ON the threshold. It fires for a
    # few minutes and then falls silent while the container is still
    # completely broken, which reads as "resolved".
    #
    # pokedex-web proved it: a bad image crashlooped for a week behind a
    # healthy ReplicaSet that kept serving. The old rule fired for two
    # evaluations and went quiet - the rate never exceeded 4.0.
    #
    # kube_pod_container_status_waiting_reason is 1 for as long as the
    # container is in CrashLoopBackOff, with no threshold to fall below.
    # Confirmed against that outage: 1 for all 19 samples between 21:00
    # and 00:10, where the rate-based rule saw nothing after 22:30.
    #
    # Deliberately NOT a Deployment-level rule. Through that whole week
    # kube_deployment_status_replicas_{updated,available,spec} were all 1,
    # because the surviving old pod satisfies every one of them. The
    # failure is only visible at the container.
    - uid: cfmld7mw9c5j4ecr
      title: Pod container crash looping
      condition: B
      # 10m rather than 15m: the state is true immediately, so this only
      # has to outlast a genuine restart-and-recover.
      for: 10m
      noDataState: OK
      execErrState: OK
      labels: { component: workloads, severity: warning }
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff'
        description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff for 10m. This can be true while the service is still UP: a failed rolling update leaves the previous ReplicaSet serving, so nothing else reports a problem. Check `kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c {{ $labels.container }} --previous`, and `kubectl get rs -n {{ $labels.namespace }}` to see whether an old ReplicaSet is covering for it."
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: grafanacloud-prom
          model: { expr: 'max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"})', instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [0] }
