# Vault + ExternalSecrets alerts. These are cluster-wide load-bearing —
# when Vault is sealed or ESO can't fetch, ~every app that reads a Vault-
# backed secret will start degrading on its next refresh. Prior to the
# 2026-09-13 auto-unseal work, a sealed Vault after a pod restart would
# silently break dozens of ExternalSecrets and no one knew until an app
# hit its refresh interval; these alerts close that gap.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: secrets
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: local
  folderRef: monitoring
  interval: 60s
  rules:
    - uid: vault-sealed
      title: Vault is sealed
      condition: B
      # 3m — Vault takes ~30s to auto-unseal on pod restart; anything
      # longer means auto-unseal itself is failing (AWS KMS down, IAM
      # creds rotated, k8s Secret deleted, etc.). Every second sealed
      # blocks downstream ESO refreshes.
      for: 3m
      noDataState: Alerting
      execErrState: Alerting
      labels: { component: vault, severity: critical }
      annotations:
        summary: "Vault has been sealed for over 3m — downstream ExternalSecrets are stalling"
        description: "Vault at default/vault-0 reports sealed=1. Auto-unseal (AWS KMS) should complete within ~30s of a pod start; if it is still sealed after 3m, either KMS is unreachable, the vault-autounseal-aws k8s Secret is missing/rotated, or the seal migration got interrupted. Check `kubectl -n default logs vault-0 | grep -iE 'seal|unseal|kms'`. Break-glass: recovery keys are in 1P (homelab-vault-unseal-keys) — `vault operator unseal <key>` will still work with those to bring it up manually while you debug KMS."
      data:
        - refId: A
          relativeTimeRange: { from: 180, to: 0 }
          datasourceUid: grafanacloud-prom
          model: { expr: 'max(vault_core_unsealed) == 0', instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [0] }

    - uid: eso-sync-failing
      title: ExternalSecret failing to sync
      condition: B
      # 15m — some ExternalSecrets refresh hourly; a single failed poll
      # is usually transient (Vault reconnect, etc). 15m of continuous
      # failure means the secret is going stale and downstream pods are
      # about to notice.
      for: 15m
      noDataState: OK
      execErrState: OK
      labels: { component: secrets, severity: warning }
      annotations:
        summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been failing to sync for >15m"
        description: "External-secrets-operator can't reconcile ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} against its SecretStore. Most common causes: Vault sealed, SecretStore auth expired, kv path renamed/deleted. Check `kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }}` for the exact error, and `kubectl get secretstores -A` for the store's Ready status."
      data:
        - refId: A
          relativeTimeRange: { from: 900, to: 0 }
          datasourceUid: grafanacloud-prom
          model: { expr: 'max by (namespace, name) (externalsecret_status_condition{condition="Ready", status="False"})', instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [0] }
