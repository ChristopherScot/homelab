# Longhorn alert rules (provisioned as code; were UI-only before the
# SQLite->Postgres migration). UIDs preserved from the originals so existing
# silences/links stay valid. Query A hits the VictoriaMetrics datasource
# (uid grafanacloud-prom); B is a threshold expression.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: longhorn
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: local
  folderRef: monitoring
  interval: 60s
  rules:
    - uid: dfml6mxpjk8owecr
      title: Longhorn volume not healthy
      condition: B
      for: 10m
      noDataState: OK
      execErrState: OK
      labels: { app: longhorn, severity: warning }
      annotations:
        summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is not healthy (robustness code {{ $values.A }}: 2=degraded, 3=faulted) on node {{ $labels.node }}"
        description: "The Longhorn volume backing {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has been degraded or faulted for over 10m. Check the Longhorn UI or `kubectl get volumes.longhorn.io -n longhorn-system`. Degraded usually self-heals via replica rebuild; faulted needs attention."
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: grafanacloud-prom
          # >= 2 means degraded or faulted. Robustness 0 (unknown) is what a
          # DETACHED volume reports - every scale-to-zero app parks its volume
          # there while asleep, so != 1 paged for healthy sleeping apps.
          model: { expr: "longhorn_volume_robustness >= 2", instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [0] }
    # Robustness only grades volumes that are SERVING. The failure it
    # cannot see: a workload wants its volume and the attach never
    # completes (dead LUN, node network black-hole) - the pod hangs in
    # ContainerCreating while robustness reads "unknown". A healthy
    # attach passes through state 4 in seconds; a scale-to-zero volume
    # sleeps at 3 (detached) and never enters 4 uninvited.
    - uid: dfml7stuckattach
      title: Longhorn volume stuck attaching
      condition: B
      for: 10m
      noDataState: OK
      execErrState: OK
      labels: { app: longhorn, severity: warning }
      annotations:
        summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has been stuck attaching for 10m on node {{ $labels.node }}"
        description: "A workload is waiting on this volume but the attach has not completed in 10m (state=attaching). Its pod is likely stuck in ContainerCreating. Check `kubectl get volumes.longhorn.io -n longhorn-system`, `kubectl describe pod` for the consumer, and the Longhorn UI. Past causes here: iSCSI LUN gone, node network black-holing long flows."
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: grafanacloud-prom
          # longhorn_volume_state: 2=attached, 3=detached, 4=attaching
          model: { expr: "longhorn_volume_state == 4", instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [0] }
    # With filtering exprs above, "no data" is the healthy steady state -
    # which makes a dead metrics pipeline indistinguishable from a healthy
    # fleet. This backstop fires if the robustness family vanishes outright.
    - uid: dfml7absentlhms
      title: Longhorn metrics absent
      condition: B
      for: 15m
      noDataState: OK
      execErrState: OK
      labels: { app: longhorn, severity: warning }
      annotations:
        summary: "Longhorn volume metrics have been absent for 15m - volume alerts are flying blind"
        description: "longhorn_volume_robustness has no series at all, so the volume-health and stuck-attaching alerts above cannot fire regardless of actual volume state. Check longhorn-manager pods and the metrics pipeline (Alloy -> VictoriaMetrics)."
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: grafanacloud-prom
          model: { expr: "absent(longhorn_volume_robustness)", instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [0] }
    - uid: cfml6nlv6pmgwdcr
      title: Longhorn backup in error state
      condition: B
      for: 10m
      noDataState: OK
      execErrState: OK
      labels: { component: backups, severity: warning }
      annotations:
        summary: "One or more Longhorn backups are in an error state"
        description: "At least one Longhorn Backup CR is in error state (state=4) for over 10m. Identify which: `kubectl get backups.longhorn.io -n longhorn-system` (look for state=Error) or the Longhorn UI Backup tab. Common causes: NFS target unreachable mid-backup, disk full, network blip during the weekly backup job."
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: grafanacloud-prom
          model: { expr: "count(longhorn_backup_state == 4)", instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [0] }
    - uid: dfml6o97a28zkccr
      title: Longhorn auto-backup hasn't succeeded in >8 days
      condition: B
      for: 10m
      noDataState: Alerting
      execErrState: OK
      labels: { component: backups, severity: critical }
      annotations:
        summary: "Longhorn auto-backup hasn't succeeded in >8 days"
        description: "The Longhorn auto-backup CronJob (weekly Sundays 3am, writes to node2-hdd) has not succeeded in >8 days. PVCs have lost backup coverage. Check `kubectl get jobs -n longhorn-system` and the Longhorn UI Backup tab."
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: grafanacloud-prom
          model: { expr: 'time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="auto-backup"}', instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [691200] }
    - uid: bfml6ovsgi9dsbcr
      title: Backup mirror to Synology hasn't succeeded in >8 days
      condition: B
      for: 10m
      noDataState: Alerting
      execErrState: OK
      labels: { component: backups, severity: warning }
      annotations:
        summary: "Backup mirror to Synology hasn't succeeded in >8 days"
        description: "The longhorn-backup-mirror CronJob (rsync node2-hdd -> Synology /volume1/media, weekly Sundays 5am) has not succeeded in >8 days. Primary backups on node2 are fine; the second copy on Synology is stale."
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: grafanacloud-prom
          model: { expr: 'time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="longhorn-backup-mirror"}', instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A }
        - refId: B
          relativeTimeRange: { from: 0, to: 0 }
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - evaluator: { type: gt, params: [691200] }
