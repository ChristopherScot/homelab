# Credentials for the desloppify pod, from kv/claude-pods/desloppify.
#
# Kept as their own ExternalSecrets rather than merged into
# claude-git-creds: that secret holds a token with broad access to the
# homelab repos, and this pod must have neither that token nor anything
# like it. The whole guarantee that it cannot reach main rests on its
# credential being narrow, so the two must not share a secret that a
# future edit could widen.
#
# The GitHub token is a copy of kv/github/app-agent-access. Rotating the
# PAT means writing both, and the runner's preflight is what catches a
# stale copy: it refuses to start on a token that can read main's branch
# protection.
---
# Fine-grained PAT, scoped to schoolhouse-world/app alone, with Contents
# and Pull requests write and NO Administration scope. Verified by
# verify-token-scope.sh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: desloppify-git
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-claude-pods
    kind: SecretStore
  target:
    name: desloppify-git
    template:
      type: Opaque
      data:
        token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef: { key: claude-pods/desloppify, property: github_token }
---
# Claude subscription token from `claude setup-token`, valid one year.
#
# A one-year token rather than the interactive login the session pods
# use: that credential is periodically found with empty strings and
# expiresAt=0, which this pod would have no peer to repair from.
#
# The Agent SDK spawns the claude binary, which reads this. An
# ANTHROPIC_API_KEY in the environment silently outranks it and bills per
# token against the API account, so the runner unsets both.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: desloppify-claude
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-claude-pods
    kind: SecretStore
  target:
    name: desloppify-claude
    template:
      type: Opaque
      data:
        oauth-token: "{{ .oauth_token }}"
        oauth-token-personal: "{{ .oauth_token_personal }}"
  # Each property is named explicitly, so this pulls these two keys and
  # nothing else from kv/claude-pods/desloppify - the github_token at the
  # same path is not reachable through this secret. Adding a key here is
  # a visible edit, which is the point.
  data:
    - secretKey: oauth_token
      remoteRef: { key: claude-pods/desloppify, property: claude_oauth_token }
    # A rate limit is per account. Work is tried first and this is the
    # reserve; see run_with_account_failover in lib/nightly-common.sh.
    - secretKey: oauth_token_personal
      remoteRef:
        key: claude-pods/desloppify
        property: claude_oauth_token_personal
