# KEDA owns desloppify-0's wake/sleep cycle: 1 replica during the nightly
# window, 0 outside it. This is KEDA's cron scaler — its recommended shape
# for a workload that runs on a schedule — rather than kubectl scale
# commands baked into the trigger CronJob.
#
# This file is the cron-window pattern's documentation home: the window
# invariant below, the counts-from-creation gotcha, and the
# paused-replicas recipe apply to every instance. Other instances
# (codex-pods/codex-scaledobject.yaml) carry their own numbers and point
# here.
#
# The window brackets the nightly-desloppify CronJob (desloppify-cronjob.yaml):
#   02:55  wake, five minutes before the 03:00 trigger, so the image pull
#          and sidecars are usually ready before the exec's own
#          rollout-status wait even starts.
#   06:30  >= 03:00 + startingDeadlineSeconds (900) + activeDeadlineSeconds
#          (11400) = 06:25 — the latest a legitimately-started run can
#          live, since the active deadline counts from job creation, not
#          from 03:00. Window end is also what ends a run the deadline
#          killed, so the pod never stays awake all day after a bad night.
# Move these together: all three inputs live on the CronJob.
#
# Manual daytime use: KEDA reverts a bare `kubectl scale` within its
# polling interval. To hold the pod awake, pause autoscaling instead:
#   kubectl annotate scaledobject desloppify -n claude-pods \
#     autoscaling.keda.sh/paused-replicas="1"
# and remove the annotation to hand control back:
#   kubectl annotate scaledobject desloppify -n claude-pods \
#     autoscaling.keda.sh/paused-replicas-
#
# Requires KEDA core (app-of-apps/apps/keda.yaml); the sync-options
# annotation keeps this file from blocking the rest of the app's sync
# before KEDA's CRDs exist.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: desloppify
  namespace: claude-pods
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: desloppify
  minReplicaCount: 0
  maxReplicaCount: 1
  # 5 minutes after the last trigger goes inactive, which for the busy
  # trigger means 5 minutes after the run's own pod exits. Stated rather
  # than left to the default so the two numbers that decide when the pod
  # dies are both visible here.
  cooldownPeriod: 300
  # Two triggers, and the HPA takes max() across them - that is what
  # makes this an OR. The cron wakes the pod on schedule; the workload
  # trigger keeps it awake while a run is in flight, including past the
  # cron's end time.
  triggers:
    # The wake. Starts 5 minutes before the 03:00 CronJob so the pod is
    # ready when the trigger job execs into it.
    - type: cron
      metadata:
        timezone: America/New_York
        start: 55 2 * * *
        end: 30 6 * * *
        desiredReplicas: "1"
    # The hold. Counts the trigger CronJob's own pod, which carries this
    # label and lives for exactly as long as the run: its container is a
    # blocking `kubectl exec` with no `&`, so the pod is Running until
    # nightly-desloppify.sh returns.
    #
    # This is the fix for the 2026-11-14 incident. The cron trigger alone
    # scaled the set to 0 at 06:30 with an agent mid-ticket, which killed
    # that run and wedged the next three on a half-created stack branch.
    # A run that overruns its window now holds the pod itself.
    #
    # The scaler reports a RAW COUNT of matching non-terminated pods -
    # read from kubernetes_workload_scaler.go at v2.21.0, because the
    # docs describe a "relation = count / workload pods" that the code
    # does not compute. That matters here: a ratio would divide by zero
    # while the StatefulSet sits at 0 replicas, which is exactly when
    # this trigger has to fire. A raw count has no such problem.
    #
    # Activation is `count > activationValue`, and activationValue
    # defaults to 0, so one matching pod is enough to hold the set up
    # from zero. value: "1" is the HPA target, giving 1 replica per
    # matching pod - and maxReplicaCount caps it at 1 regardless.
    #
    # The hold releases when the pod reaches a TERMINAL phase, not when
    # the run ends. shouldCountPod excludes only Succeeded and Failed,
    # so Pending, Running and Unknown all keep counting.
    #
    # In the normal cases that is the same thing: the run finishes, the
    # container exits, the kubelet moves the pod to Succeeded or Failed,
    # the count drops to 0 and cooldownPeriod decides the rest.
    #
    # It is NOT bounded when the pod cannot reach a terminal phase, and
    # activeDeadlineSeconds does not save it - traced through k8s
    # v1.30.6 and confirmed on this cluster. The deadline makes the Job
    # controller DELETE the pod (job_controller.go deleteActivePods, an
    # ordinary graceful delete); deletion sets deletionTimestamp and
    # leaves status.phase at Running, which only the kubelet changes. A
    # test pod here reported `phase=Running deletionTimestamp=<set>`
    # after deletion, and KEDA checks phase with no deletionTimestamp
    # check. So:
    #
    #   - kubelet unreachable, node object still Ready: nothing moves
    #     the phase, and PodGC does not engage.
    #   - node lost: podgc gcTerminating needs the node NotReady AND the
    #     node.kubernetes.io/out-of-service taint, which is only ever
    #     applied by an operator.
    #   - stuck finalizer: the pod persists at Running.
    #
    # In those cases the pod pins this set at 1 replica until a human
    # intervenes. maxReplicaCount: 1 caps it at one idle pod, and note
    # `hold-run.sh --release` does NOT clear it - that clears the
    # paused-replicas annotation, a different mechanism, while this
    # trigger goes on counting the stuck pod. The remedy is:
    #
    #   kubectl delete pod <trigger-pod> -n claude-pods --force --grace-period=0
    #
    # No authentication: the scaler lists pods as KEDA's own identity
    # (its ClusterRole grants pods get/list/watch), scoped to this
    # namespace.
    - type: kubernetes-workload
      metadata:
        podSelector: 'desloppify.homelab/run=active'
        value: "1"
