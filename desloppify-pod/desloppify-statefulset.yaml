# The desloppify pod: one replica, its own PVCs, its own credentials.
#
# Separate from claude-session-* deliberately. It works on
# schoolhouse-world/app, where a merge to main reaches production, and
# the guarantee that it cannot do that rests on its PAT being scoped to
# one repository with no Administration. A pod that also held
# claude-git-creds would have a second, broader token sitting beside it.
#
# Its image is its own (desloppify-pod/Dockerfile), carrying node 22,
# yarn, python and the claude binary - what desloppify's TypeScript
# detectors shell out to (npx, tsc, eslint, knip, vitest) and what the
# agent needs to verify a refactor by running `yarn lint` and the tests.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: desloppify
  namespace: claude-pods
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: desloppify
  namespace: claude-pods
spec:
  serviceName: desloppify
  replicas: 1
  selector:
    matchLabels:
      app: desloppify
  template:
    metadata:
      labels:
        app: desloppify
    spec:
      serviceAccountName: desloppify
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: desloppify
          image: ghcr.io/christopherscot/desloppify-pod:latest
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
          env:
            # The SDK spawns the claude binary, which reads this. Either
            # API-key variable silently outranks it and bills per token
            # against the API account instead of the subscription, so the
            # runner unsets both; they are simply never set here.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: desloppify-claude
                  key: oauth-token
                  optional: true
            # Below the 9Gi container limit, so a type-check that grows
            # too large fails in node with a heap error the run can
            # report, rather than as an OOMKill that takes the pod with
            # it and leaves no log.
            - name: NODE_OPTIONS
              value: "--max_old_space_size=7168"
            - name: DESLOP_STATE_DIR
              value: /workspace/.desloppify-state
            - name: DESLOP_WORK_ROOT
              value: /workspace
          volumeMounts:
            - name: home
              mountPath: /home/node
            # The clone, node_modules and desloppify's state. It persists
            # because installing it is expensive, and it lives on SSD
            # because the cost is small random writes, not bulk: yarn's
            # fetch step pulled 503MB in 77 seconds, and its link step
            # then spent 23m50s building native modules against the HDD
            # tier. The same volume faulted mid-run.
            - name: workspace
              mountPath: /workspace
            - name: desloppify-git
              mountPath: /run/secrets/desloppify
              readOnly: true
            - name: desloppify-claude
              mountPath: /run/secrets/claude
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            # A tsc pass over this monorepo is the spike, and 6Gi was
            # not enough: the first scheduled run was OOMKilled. 9Gi is
            # what the nodes can give - node1 and node2 have ~11.6Gi
            # allocatable and run other workloads - so the agent is also
            # told to cap node's heap below it rather than rely on the
            # repo's own 8GB setting, which leaves nothing for the rest
            # of the process.
            limits:
              memory: 9Gi
      volumes:
        - name: desloppify-git
          secret:
            secretName: desloppify-git
            optional: true
        - name: desloppify-claude
          secret:
            secretName: desloppify-claude
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-single-ssd
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-single-ssd
        resources:
          requests:
            storage: 25Gi
