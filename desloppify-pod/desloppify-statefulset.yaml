# The desloppify pod: one replica, its own PVCs, its own credentials.
#
# Separate from claude-session-* deliberately. It works on
# schoolhouse-world/app, where a merge to main reaches production, and
# the guarantee that it cannot do that rests on its PAT being scoped to
# one repository with no Administration. A pod that also held
# claude-git-creds would have a second, broader token sitting beside it.
#
# Its image is its own (desloppify-pod/Dockerfile), carrying node 22,
# yarn, python and the claude binary - what desloppify's TypeScript
# detectors shell out to (npx, tsc, eslint, knip, vitest) and what the
# agent needs to verify a refactor by running `yarn lint` and the tests.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: desloppify
  namespace: claude-pods
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: desloppify
  namespace: claude-pods
spec:
  serviceName: desloppify
  # No replicas: field — the nightly-desloppify CronJob scales this
  # between 0 (asleep, the steady state) and 1 (during its run); see
  # desloppify-cronjob.yaml. A value here would make Argo selfHeal
  # fight that scaling on every sync. Initial creation defaults to 1;
  # the first nightly cycle puts it to sleep.
  selector:
    matchLabels:
      app: desloppify
  template:
    metadata:
      labels:
        app: desloppify
    spec:
      serviceAccountName: desloppify
      # Keep this pod off the nodes running the session pods. Those are
      # three replicas with 2Gi limits each and no anti-affinity of
      # their own; co-located with this pod's 9.5Gi the ceiling reaches
      # 15.5Gi on a node with ~11.6Gi allocatable. Preferred rather than
      # required, so a node drain does not leave this unschedulable.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: claude-session
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        # Native sidecars: initContainers with restartPolicy Always,
        # which k8s 1.29 made GA and this cluster (1.30.6) supports.
        # Ordinary containers would have been wrong twice over - nothing
        # orders them before the agent, so the suite can run against a
        # Postgres still initialising, and nothing stops them keeping the
        # pod alive if this ever becomes Job-shaped. The readiness probes
        # are what make "started" mean "accepting connections".
        #
        # The vitest suite talks to Hasura, Postgres and Redis. Without
        # them a run verifies with typecheck and lint only, which is how
        # a 239-file refactor of the client/server seam shipped with no
        # test ever executed against it.
        #
        # Sidecars rather than Services: containers in a pod share a
        # network namespace, so these answer on localhost at the ports
        # src/tests/.envs/.env.test.local already names, and the suite
        # needs no change. The usual `yarn test:containers-up` is a
        # no-op here - they are already up.
        #
        # Mirrors projects/webapp/src/tests/docker-compose.yml, which
        # lives in another repo and can change without reference to this
        # file. test-sidecars.sh compares the two and fails on drift;
        # fixing it is a hand edit, which is the accepted cost of
        # keeping the suite on localhost.
        - name: postgres-test
          restartPolicy: Always
          image: postgres:16-alpine
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data-tests/pgdata
            - name: POSTGRES_USER
              value: shw
            - name: POSTGRES_PASSWORD
              value: shw
            - name: POSTGRES_DB
              value: shw
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
          args: ["-p", "5430"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-p", "5430", "-U", "shw"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: test-pgdata
              mountPath: /var/lib/postgresql/data-tests
          resources:
            # Requested near the limit, not far below it. A request is
            # what the scheduler reserves and what the kubelet ranks by
            # under memory pressure; a sidecar requesting 64Mi against a
            # 512Mi limit is among the first things killed, and a
            # postgres killed mid-suite restarts onto an emptyDir that
            # kept its half-written data - the confusing failure these
            # sidecars exist to prevent.
            requests:
              cpu: 10m
              memory: 448Mi
            limits:
              memory: 512Mi

        - name: redis-tests
          restartPolicy: Always
          image: redis:6-alpine
          args: ["--port", "6377"]
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "6377", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              memory: 256Mi

        - name: hasura-tests
          restartPolicy: Always
          image: hasura/graphql-engine:v2.45.1
          env:
            - name: HASURA_GRAPHQL_SERVER_PORT
              value: "8078"
            # The compose file reads these from .env.test.local, which
            # is committed in the app repo. They are test-only values
            # against a throwaway database in this pod.
            - name: HASURA_GRAPHQL_DATABASE_URL
              value: postgres://shw:shw@localhost:5430/shw
            - name: HASURA_GRAPHQL_ENABLE_CONSOLE
              value: "false"
            # The compose service reads these from .env.test.local via
            # env_file:, which a container spec cannot do. Without them
            # this Hasura is unauthenticated and has no JWT config -
            # harmless while nothing dials it, and wrong the moment a
            # test does. The values are the committed test ones, against
            # a throwaway database in this pod.
            - name: HASURA_GRAPHQL_ADMIN_SECRET
              value: myadminsecretkey
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8078
            periodSeconds: 2
            # Hasura waits on Postgres, which it reaches on localhost
            # only once that sidecar is up; 90s covers both.
            failureThreshold: 45
          resources:
            requests:
              cpu: 10m
              memory: 640Mi
            limits:
              memory: 768Mi
      containers:
        - name: desloppify
          image: ghcr.io/christopherscot/desloppify-pod:latest
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
          env:
            # The SDK spawns the claude binary, which reads this. Either
            # API-key variable silently outranks it and bills per token
            # against the API account instead of the subscription, so the
            # runner unsets both; they are simply never set here.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: desloppify-claude
                  key: oauth-token
                  optional: true
            # Below the 9Gi container limit, so a type-check that grows
            # too large fails in node with a heap error the run can
            # report, rather than as an OOMKill that takes the pod with
            # it and leaves no log.
            - name: NODE_OPTIONS
              value: "--max_old_space_size=6144"
            - name: DESLOP_STATE_DIR
              value: /workspace/.desloppify-state
            - name: DESLOP_WORK_ROOT
              value: /workspace
          volumeMounts:
            - name: home
              mountPath: /home/node
            # The clone, node_modules and desloppify's state. It persists
            # because installing it is expensive, and it lives on SSD
            # because the cost is small random writes, not bulk: yarn's
            # fetch step pulled 503MB in 77 seconds, and its link step
            # then spent 23m50s building native modules against the HDD
            # tier. The same volume faulted mid-run.
            - name: workspace
              mountPath: /workspace
            - name: desloppify-git
              mountPath: /run/secrets/desloppify
              readOnly: true
            - name: desloppify-claude
              mountPath: /run/secrets/claude
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            # A tsc pass over this monorepo is the spike, and 6Gi was
            # not enough: the first scheduled run was OOMKilled. 9Gi is
            # what the nodes can give - node1 and node2 have ~11.6Gi
            # allocatable and run other workloads - so the agent is also
            # told to cap node's heap below it rather than rely on the
            # repo's own 8GB setting, which leaves nothing for the rest
            # of the process.
            #
            # 8Gi rather than 9: the test sidecars below add 1.5Gi of
            # ceiling, and the nodes have ~11.6Gi allocatable while
            # running other workloads. The node heap cap is set below
            # this so an oversized type-check fails in node rather than
            # as an OOMKill.
            limits:
              memory: 8Gi

      volumes:
        # Throwaway: the suite creates what it needs and nothing here
        # outlives the pod.
        - name: test-pgdata
          emptyDir: {}
        - name: desloppify-git
          secret:
            secretName: desloppify-git
            optional: true
        - name: desloppify-claude
          secret:
            secretName: desloppify-claude
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-single-ssd
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-single-ssd
        resources:
          requests:
            storage: 25Gi
