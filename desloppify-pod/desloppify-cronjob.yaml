# Nightly desloppify run against projects/webapp in schoolhouse-world/app.
#
# Runs at 03:00 in its own pod, desloppify-0 - not in a session pod:
# the repository it works on is one where a merge to main reaches
# production, so its PAT is scoped to that one repo with no
# Administration, and no broader token sits beside it.
#
# This holds no logic - it execs the script baked into the image, so the
# work runs in desloppify-0 with its PVCs, its Vault-mounted tokens and
# its node_modules cache.
#
# desloppify-0 sleeps (replicas 0) outside its nightly window. KEDA's cron
# scaler owns the wake and sleep (desloppify-scaledobject.yaml); this job
# only waits for ready and execs. The wait matters: KEDA wakes the pod at
# 02:55, but a cold image pull can outlast the five-minute head start.
---
# Only what the trigger needs: find the pod, see it become ready, exec
# one script in it. Scaling is KEDA's, not this ServiceAccount's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: desloppify-runner
  namespace: claude-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: desloppify-runner
  namespace: claude-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # `kubectl rollout status` watches the StatefulSet.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: desloppify-runner
  namespace: claude-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: desloppify-runner
subjects:
  - kind: ServiceAccount
    name: desloppify-runner
    namespace: claude-pods
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-desloppify
  namespace: claude-pods
spec:
  schedule: "0 3 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # One attempt. A desloppify session that failed halfway has already
      # written to its state directory and may have pushed a branch;
      # starting again from the top would duplicate that work rather than
      # resume it.
      backoffLimit: 0
      # 3h for the run itself (the historical budget) plus 10 minutes
      # for the wait-ready initContainer when the 02:55 wake-up is still
      # pulling images. The ScaledObject's window end is scheduled after
      # 03:00 + this deadline.
      activeDeadlineSeconds: 11400
      template:
        spec:
          serviceAccountName: desloppify-runner
          restartPolicy: Never
          initContainers:
            # Wait for the pod KEDA woke at 02:55 to be ready before the
            # exec. rollout status watches the StatefulSet itself, so it
            # doesn't race the controller creating the pod object the way
            # `kubectl wait pod` would. If KEDA never woke it (KEDA down,
            # ScaledObject missing), this times out and the job fails
            # visibly instead of exec'ing into nothing.
            - name: wait-ready
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - rollout
                - status
                - statefulset/desloppify
                - -n
                - claude-pods
                - --timeout=600s
          containers:
            - name: trigger
              # registry.k8s.io is upstream and keeps its version tags.
              # bitnami/kubectl:1.30 was deleted from Docker Hub, so the
              # job sat in ErrImagePull until its deadline killed it -
              # three silent failures, reported as DeadlineExceeded
              # rather than as a missing image. nightly-cronjobs.yaml
              # already carries this fix; this manifest was written from
              # an older copy and reintroduced it.
              #
              # No `sh -c` wrapper: this image's entrypoint IS kubectl
              # and it ships no shell, so a shell form exits 128 before
              # running. The budget goes through env(1) in the pod
              # rather than a shell assignment for the same reason.
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - exec
                - -n
                - claude-pods
                - desloppify-0
                - --
                - env
                - DESLOP_MAX_COST_USD=50
                - /usr/local/bin/nightly-desloppify.sh
