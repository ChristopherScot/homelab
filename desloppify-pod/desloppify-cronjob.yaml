# Nightly desloppify run against projects/webapp in schoolhouse-world/app.
#
# Runs at 03:00 in its own pod, desloppify-0 - not in a session pod:
# the repository it works on is one where a merge to main reaches
# production, so its PAT is scoped to that one repo with no
# Administration, and no broader token sits beside it.
#
# This holds no logic - it execs the script baked into the image, so the
# work runs in desloppify-0 with its PVCs, its Vault-mounted tokens and
# its node_modules cache.
#
# desloppify-0 sleeps (replicas 0) outside its nightly window: initContainers
# scale it up and wait for ready before the exec, and the separate sleep
# CronJob at the end of this file scales it back down. The sleep cron is
# time-based rather than tied to the run's exit so that a run killed by
# activeDeadlineSeconds (which a trap inside the job could never observe,
# and this image has no shell for one anyway) still ends asleep.
---
# Only what the trigger needs: find the pod, scale its StatefulSet,
# and exec one script in it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: desloppify-runner
  namespace: claude-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: desloppify-runner
  namespace: claude-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # `kubectl rollout status` reads the StatefulSet; `kubectl scale`
  # reads and writes its scale subresource.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: desloppify-runner
  namespace: claude-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: desloppify-runner
subjects:
  - kind: ServiceAccount
    name: desloppify-runner
    namespace: claude-pods
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-desloppify
  namespace: claude-pods
spec:
  schedule: "0 3 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # One attempt. A desloppify session that failed halfway has already
      # written to its state directory and may have pushed a branch;
      # starting again from the top would duplicate that work rather than
      # resume it.
      backoffLimit: 0
      # 3h for the run itself (the historical budget) plus 10 minutes
      # for wake-up: scale-up, image pulls on a cold node, sidecars
      # becoming ready. The sleep cron below is scheduled after
      # 03:00 + this deadline.
      activeDeadlineSeconds: 11400
      template:
        spec:
          serviceAccountName: desloppify-runner
          restartPolicy: Never
          initContainers:
            # Wake desloppify-0. Idempotent: scaling 1 -> 1 is a no-op,
            # so a pod left awake (deadline-killed previous run, manual
            # scale-up) doesn't break the trigger.
            - name: wake
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - scale
                - statefulset
                - desloppify
                - -n
                - claude-pods
                - --replicas=1
            # Wait for ready before the exec. rollout status watches the
            # StatefulSet itself, so it doesn't race the controller
            # creating the pod object the way `kubectl wait pod` would.
            - name: wait-ready
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - rollout
                - status
                - statefulset/desloppify
                - -n
                - claude-pods
                - --timeout=600s
          containers:
            - name: trigger
              # registry.k8s.io is upstream and keeps its version tags.
              # bitnami/kubectl:1.30 was deleted from Docker Hub, so the
              # job sat in ErrImagePull until its deadline killed it -
              # three silent failures, reported as DeadlineExceeded
              # rather than as a missing image. nightly-cronjobs.yaml
              # already carries this fix; this manifest was written from
              # an older copy and reintroduced it.
              #
              # No `sh -c` wrapper: this image's entrypoint IS kubectl
              # and it ships no shell, so a shell form exits 128 before
              # running. The budget goes through env(1) in the pod
              # rather than a shell assignment for the same reason.
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - exec
                - -n
                - claude-pods
                - desloppify-0
                - --
                - env
                - DESLOP_MAX_COST_USD=50
                - /usr/local/bin/nightly-desloppify.sh
---
# Puts desloppify-0 back to sleep, unconditionally.
#
# Time-based rather than run-from-the-job because this covers every exit:
# success, failure, and the run the deadline killed - the case a cleanup
# step inside the job can never reach. 06:30 is 03:00 plus the job's
# activeDeadlineSeconds (11400s = 06:10) with slack; move it if either
# of those moves.
#
# Scaling to 0 while someone is exec'd into the pod kills that session.
# At 06:30 that is the deliberate trade; for daytime poking, scale up
# manually and expect this to tuck it back in the next morning.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-desloppify-sleep
  namespace: claude-pods
spec:
  schedule: "30 6 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # Scale-to-zero is idempotent, so retrying a transient API error
      # is safe - unlike the run trigger, where backoffLimit is 0.
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: desloppify-runner
          restartPolicy: Never
          containers:
            - name: sleep
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - scale
                - statefulset
                - desloppify
                - -n
                - claude-pods
                - --replicas=0
