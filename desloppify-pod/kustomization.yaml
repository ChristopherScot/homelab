# Switches the desloppify-pod Argo Application from directory mode to
# kustomize mode so argocd-image-updater can pin the image by digest on
# the live Application. Same shape as claude-pods/kustomization.yaml,
# which carries the reasoning - including why only what is listed
# under resources is deployed from now on.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - desloppify-cronjob.yaml
  - desloppify-scaledobject.yaml
  - desloppify-secrets.yaml
  - desloppify-statefulset.yaml
images:
  - name: ghcr.io/christopherscot/desloppify-pod
    newTag: latest
