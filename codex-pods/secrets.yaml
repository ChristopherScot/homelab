apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: codex-pods
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-codex-pods
  namespace: codex-pods
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: codex-pods
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codex-access-token
  namespace: codex-pods
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-codex-pods
    kind: SecretStore
  target:
    name: codex-access-token
  data:
    - secretKey: access-token
      remoteRef:
        key: codex-pods/auth
        property: access_token
---
# Reuse the existing GitHub account in Vault without sharing K8s resources.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codex-git
  namespace: codex-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-codex-pods
    kind: SecretStore
  target:
    name: codex-git
  data:
    - secretKey: token
      remoteRef: { key: claude-pods/git, property: token }
    - secretKey: email
      remoteRef: { key: claude-pods/git, property: email }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codex-ghcr-pull
  namespace: codex-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-codex-pods
    kind: SecretStore
  target:
    name: codex-ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: claude-pods/git, property: username }
    - secretKey: token
      remoteRef: { key: claude-pods/git, property: token }
