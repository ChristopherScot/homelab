# Idempotent post-deploy config for Prowlarr. Adds Sonarr + Radarr as
# "applications" so indexers added in Prowlarr auto-sync to both.
# Indexers themselves are added separately (see prowlarr-indexers section).
#
# Why apps not Apps? Prowlarr's API uses /api/v1/applications.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowlarr-configure
  namespace: media
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: configure
              image: alpine:3.20
              env:
                - name: PROWLARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: prowlarr
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: sonarr
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: radarr
                - name: READARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: readarr
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache curl jq >/dev/null
                  PROWLARR=http://prowlarr.media.svc.cluster.local:9696
                  H="-H X-Api-Key:$PROWLARR_API_KEY -H Content-Type:application/json"

                  echo "==> waiting for prowlarr"
                  until curl -sf $H "$PROWLARR/api/v1/system/status" >/dev/null; do sleep 2; done

                  add_app() {
                    local NAME=$1 IMPLEMENTATION=$2 BASE_URL=$3 API_KEY=$4 SYNC_LEVEL=$5
                    local EXISTING=$(curl -sf $H "$PROWLARR/api/v1/applications" | jq -r ".[] | select(.name==\"$NAME\") | .id")
                    local PAYLOAD=$(jq -n \
                      --arg name "$NAME" \
                      --arg impl "$IMPLEMENTATION" \
                      --arg url "$BASE_URL" \
                      --arg key "$API_KEY" \
                      --arg sync "$SYNC_LEVEL" \
                      '{
                        name: $name,
                        syncLevel: $sync,
                        implementationName: $impl,
                        implementation: $impl,
                        configContract: ($impl + "Settings"),
                        tags: [],
                        fields: [
                          {name:"prowlarrUrl",value:"http://prowlarr.media.svc.cluster.local:9696"},
                          {name:"baseUrl",value:$url},
                          {name:"apiKey",value:$key},
                          {name:"syncCategories",value:[2000,2010,2020,2030,2035,2040,2045,2050,2060,2070,2080,2090,5000,5010,5020,5030,5040,5045,5050,5060,5070,5080,5090]}
                        ]
                      }')
                    if [ -z "$EXISTING" ]; then
                      echo "==> adding $NAME"
                      curl -sf $H "$PROWLARR/api/v1/applications" -d "$PAYLOAD" >/dev/null
                    else
                      echo "==> updating $NAME (id=$EXISTING)"
                      local UPDATED=$(echo "$PAYLOAD" | jq --argjson id "$EXISTING" '. + {id:$id}')
                      curl -sf $H "$PROWLARR/api/v1/applications/$EXISTING" -X PUT -d "$UPDATED" >/dev/null
                    fi
                  }

                  # Use cluster-internal Service IPs rather than DNS names.
                  # Prowlarr runs inside gluetun's netns where the kube DNS
                  # resolver isn't reachable (gluetun's firewall blocks egress
                  # except via the VPN, and cluster.local isn't routable
                  # through the VPN). FIREWALL_OUTBOUND_SUBNETS allows traffic
                  # to 10.43.0.0/16 by IP. Service ClusterIPs are stable as
                  # long as the Service exists; if a Service is recreated the
                  # IP changes and this Job needs re-running.
                  SONARR_IP=$(getent hosts sonarr.media.svc.cluster.local | awk '{print $1}')
                  RADARR_IP=$(getent hosts radarr.media.svc.cluster.local | awk '{print $1}')
                  READARR_IP=$(getent hosts readarr.media.svc.cluster.local | awk '{print $1}')
                  echo "==> resolved: sonarr=$SONARR_IP radarr=$RADARR_IP readarr=$READARR_IP"

                  # Minimum seeders, applied once at the Prowlarr level.
                  #
                  # Sonarr does not rank releases by seeders - it picks on
                  # quality profile alone, and with torrentDelay=0 it grabs
                  # the first acceptable match. minimumSeeders is only a
                  # floor, and at 1 that floor lets through releases that
                  # are effectively dead. On 2026-09-28 that is how seven
                  # of eight Audacity episodes were grabbed from eztv with
                  # a single seeder and then sat in metaDL indefinitely.
                  #
                  # This lives here rather than on each indexer in Sonarr
                  # because Prowlarr syncs at fullSync and would overwrite
                  # per-indexer edits on its next sync.
                  set_seeders() {
                    local MIN=$1
                    local CUR=$(curl -sf $H "$PROWLARR/api/v1/appprofile/1")
                    [ -z "$CUR" ] && { echo "==> no appprofile/1, skipping"; return; }
                    local WANT=$(echo "$CUR" | jq --argjson m "$MIN" '. + {minimumSeeders:$m}')
                    echo "==> setting minimumSeeders=$MIN"
                    curl -sf $H "$PROWLARR/api/v1/appprofile/1" -X PUT -d "$WANT" >/dev/null
                  }
                  set_seeders 5

                  add_app "Sonarr" "Sonarr" "http://$SONARR_IP:8989" "$SONARR_API_KEY" "fullSync"
                  add_app "Radarr" "Radarr" "http://$RADARR_IP:7878" "$RADARR_API_KEY" "fullSync"
                  add_app "Readarr" "Readarr" "http://$READARR_IP:8787" "$READARR_API_KEY" "fullSync"

                  echo "==> done"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
