# qBittorrent preferences applied on every pod start by the qbit-configure
# sidecar in gluetun-qbit-prowlarr.yaml. Single source of truth for qBit
# settings — edit here, restart the pod, settings reapply.
#
# Note: qBit also persists settings in /config/qBittorrent/qBittorrent.conf
# on its PVC. The sidecar uses the API to override whatever's there with
# what's in this ConfigMap on every pod start. UI changes will revert on
# next restart — if you want a UI tweak to persist, add it here.
#
# Replaces the previous qbittorrent-configure CronJob (which was suspended
# and required manual triggering — settings drifted from this file).
#
# current_network_interface pins libtorrent to the VPN tun device. This is
# not just a kill-switch nicety, it is what makes UDP work at all.
#
# Unbound, qBit listens on 0.0.0.0 and the kernel picks a source interface
# per packet. Outbound UDP then leaves via eth0, which gluetun's firewall
# drops (OUTPUT policy DROP; only tun0 and the wireguard endpoint are
# allowed). The symptom is not an obvious firewall error - every UDP
# tracker reports "Operation not permitted" and DHT sits at 0 nodes, while
# HTTPS trackers keep working because those connections are already
# ESTABLISHED. Downloads then stall in metaDL forever: magnet links need
# DHT or a live tracker to fetch metadata, and both are UDP.
#
# Seen 2026-09-28: 21 of 23 active torrents stuck at 0 B/s with
# connection_status "firewalled" and dht_nodes 0. qBit's own log shows the
# regression - on 09-24 00:16 it listened only on 10.2.0.2 (tun0), then at
# 00:39 switched to "0.0.0.0:37541,[::]:37541" and bound eth0 as well.
#
# listen_port is deliberately NOT authoritative here. The GSP docker-mod
# (see deployment.yaml) polls gluetun and rewrites it whenever Proton
# rotates the forwarded port, so the live value differs from this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-prefs
  namespace: media
data:
  prefs.json: |
    {
      "save_path": "/media/downloads/complete",
      "temp_path_enabled": true,
      "temp_path": "/media/downloads/incomplete",
      "preallocate_all": false,
      "incomplete_files_ext": true,
      "auto_delete_mode": 0,
      "queueing_enabled": true,
      "max_active_downloads": 5,
      "max_active_uploads": 999,
      "max_active_torrents": 999,
      "dont_count_slow_torrents": true,
      "max_ratio_enabled": false,
      "max_ratio": 2.0,
      "max_ratio_act": 0,
      "listen_port": 51413,
      "upnp": false,
      "current_network_interface": "tun0",
      "current_interface_address": "",
      "random_port": false,
      "encryption": 1,
      "anonymous_mode": false,
      "dht": true,
      "pex": true,
      "lsd": false,
      "add_trackers_enabled": false,
      "bypass_local_auth": true,
      "bypass_auth_subnet_whitelist_enabled": true,
      "bypass_auth_subnet_whitelist": "10.42.0.0/16",
      "alternative_webui_enabled": false,
      "use_https": false,
      "web_ui_csrf_protection_enabled": true,
      "web_ui_clickjacking_protection_enabled": true,
      "web_ui_secure_cookie_enabled": true,
      "web_ui_host_header_validation_enabled": false,
      "web_ui_session_timeout": 2592000
    }
