apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: media
  annotations:
    # Restart on shelfmark-settings Secret changes so GitOps edits to
    # qbit/prowlarr config land without manual rollout.
    reloader.stakater.com/auto: "true"
spec:
  # No replicas: field — KEDA scales this between 0 and 1 (see
  # scale-to-zero.yaml), and a value here would make Argo selfHeal
  # fight it back on every sync.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shelfmark
  template:
    metadata:
      labels:
        app: shelfmark
    spec:
      enableServiceLinks: false
      # DESTINATION_AUDIOBOOK writes audiobooks-longhorn-rwo, which is RWO
      # like books-longhorn-rwo. Every other consumer of these volumes
      # (autocaliweb, readarr, webdav) already colocates on whichever node
      # Longhorn attaches them to; shelfmark previously ran unpinned
      # because it only touched the RWX ingest PVC.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: autocaliweb
              topologyKey: kubernetes.io/hostname
      initContainers:
        # Shelfmark stores per-tab settings as separate JSON files under
        # /config/plugins/. For each managed JSON in /managed/ (rendered
        # from Vault by the shelfmark-settings ExternalSecret), deep-merge
        # it into the matching /config/plugins/<name>.json. UI-managed
        # keys in those files are preserved — only the keys we explicitly
        # set are overwritten.
        #
        # Runs in the app's own image, not alpine + `apk add jq`:
        # scale-to-zero makes this run on every wake, and apk made waking
        # depend on the Alpine CDN being reachable. The image ships
        # python3, and it's the same image the main container needs, so a
        # wake pulls nothing extra.
        - name: merge-settings
          image: ghcr.io/calibrain/shelfmark:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              # merge() is jq's `*`: recurse where both sides are objects,
              # the managed value wins otherwise.
              import glob, json, os
              def merge(a, b):
                  for k, v in b.items():
                      a[k] = merge(a[k], v) if isinstance(v, dict) and isinstance(a.get(k), dict) else v
                  return a
              os.makedirs('/config/plugins', exist_ok=True)
              for src in sorted(glob.glob('/managed/*.json')):
                  name = os.path.basename(src)
                  # settings.json is shelfmark's top-level config; every
                  # other managed file is a per-tab plugin. METADATA_PROVIDER
                  # lives in the former, and merging it into plugins/ would
                  # write a file the app never reads - which looks exactly
                  # like the setting not working.
                  dst = '/config/' + name if name == 'settings.json' else '/config/plugins/' + name
                  try:
                      with open(dst) as f:
                          cur = json.load(f)
                  except FileNotFoundError:
                      cur = {}
                  with open(src) as f:
                      managed = json.load(f)
                  with open(dst + '.new', 'w') as f:
                      json.dump(merge(cur, managed), f)
                  os.replace(dst + '.new', dst)
          volumeMounts:
            - name: config
              mountPath: /config
            - name: managed-settings
              mountPath: /managed
              readOnly: true
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:latest
          # :latest implies Always, which contacts ghcr on every wake and
          # won't start from cache when ghcr is unreachable. IfNotPresent
          # makes waking offline-safe; the cost is that image updates need
          # an explicit refresh (rollout after clearing the cached image,
          # or a reschedule to a fresh node) instead of landing on every
          # pod start.
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: America/New_York
            - name: FLASK_PORT
              value: "8084"
            # Lands directly in the autocaliweb watch folder so imports
            # are automatic — no manual copy step.
            - name: INGEST_DIR
              value: /books
          ports:
            - containerPort: 8084
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: ingest
              mountPath: /books
            # Torrent results go out to qBittorrent, which completes them
            # into /media/downloads/complete and reports that absolute
            # path back over the API. Shelfmark then reads the file from
            # that same path to move it into /books, so it needs the media
            # PVC mounted at the identical mountPath qBittorrent uses —
            # otherwise the probe is ENOENT and the import never happens.
            - name: media
              mountPath: /media
            # Audiobook library. DESTINATION_AUDIOBOOK (set in
            # settings-externalsecret.yaml) points here, so audiobooks are
            # written straight to Audiobookshelf's library and never enter
            # the Calibre ingest queue.
            - name: audiobooks
              mountPath: /audiobooks
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config-longhorn
        - name: ingest
          persistentVolumeClaim:
            claimName: acw-ingest-longhorn
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: managed-settings
          secret:
            secretName: shelfmark-settings
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks-longhorn-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: shelfmark
  namespace: media
spec:
  selector:
    app: shelfmark
  ports:
    - name: http
      port: 8084
      targetPort: 8084
