# Scale-to-zero for shelfmark via the KEDA HTTP add-on. Both shelfmark
# Ingresses (main and socket) route to _shared/keda-http-interceptor.yaml;
# this object tells the interceptor what to wake for this host.
#
# Shelfmark is a good candidate: it only matters while a human is using
# it, and its background sync (supernote-shelf-sync) runs as its own
# Deployment. Apps that do their own scheduled work (sonarr, qbittorrent)
# are not — asleep means the work doesn't happen.
#
# Wake path: request arrives -> interceptor scales the Deployment to 1
# and holds the request (response-header timeout 300s) -> pod passes the
# settings-merge initContainer and starts -> request forwarded. First
# hit after sleep pays the cold start; after that it's a normal proxy.
#
# The Deployment intentionally has no `replicas:` field — KEDA owns the
# replica count, and a value in git would make Argo's selfHeal fight it.
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: shelfmark
  namespace: media
spec:
  hosts:
    - shelfmark.home.chrisscotmartin.com
  scaleTargetRef:
    name: shelfmark
    kind: Deployment
    apiVersion: apps/v1
    service: shelfmark
    port: 8084
  replicas:
    min: 0
    max: 1
  # Seconds without traffic before scaling back to zero. Open Socket.IO
  # connections count as traffic, so an active search keeps it awake.
  scaledownPeriod: 900
