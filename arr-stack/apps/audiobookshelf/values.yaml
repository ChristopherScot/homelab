# yaml-language-server: $schema=../../_charts/arr-app/values.schema.json
name: audiobookshelf
image: ghcr.io/advplyr/audiobookshelf:2.37.2
port: 80

config:
  size: 10Gi

env:
  # The image defaults METADATA_PATH to /metadata, which would land on the
  # container overlay and be lost on restart. Keep it on the config PVC so
  # cover art and cached artwork survive.
  - name: METADATA_PATH
    value: /config/metadata

extraVolumes:
  # Audiobook library. Mounted read-WRITE on purpose: the UI's "delete from
  # file system" (DELETE /api/items/:id?hard=1) calls fs.remove() on the
  # item path, which a read-only mount would fail.
  - name: audiobooks
    mountPath: /audiobooks
    claimName: audiobooks-longhorn-rwo

# Colocate with autocaliweb: audiobooks-longhorn-rwo is RWO, and the
# routers that write it (readarr's on-import hook, the shelfmark sidecar)
# already pin to that node.
affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: autocaliweb
        topologyKey: kubernetes.io/hostname

probes:
  readiness:
    httpGet: { path: /healthcheck, port: 80 }
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    httpGet: { path: /healthcheck, port: 80 }
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 6

ingress:
  host: audiobooks.home.chrisscotmartin.com
  # NOT forward-auth gated, for the same reason as jellyfin: the
  # Audiobookshelf Android app is an API client, not a browser, and cannot
  # follow the Authelia redirect chain. Its very first call is GET /status
  # for server discovery; behind Authelia that answers 302 to auth.home
  # instead of JSON and the app fails with "Server redirected somewhere
  # else" before any login is even attempted. Verified: every endpoint the
  # app needs (/status, /ping, /healthcheck, /login, /auth/openid) returns
  # 200/301/400 straight from the pod and 302 through a gated ingress.
  #
  # ABS enforces its own auth server-side (authMethods local + openid), so
  # unlike shelfmark this is not an unauthenticated service - a caller still
  # needs an ABS login. The OIDC "Login with OpenId" button keeps working
  # for browsers; it just is not forced by the ingress any more.
  #
  # The Authelia access_control rule for audiobooks.home is now unused but
  # left in place, as removing it would 403 the host if this is ever
  # re-gated.
  authelia: none
  annotations:
    # Audiobooks are ~1.2 GB. Without these nginx buffers the response to
    # disk and times out mid-download, same as the webdav ingress.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # 6400, not 600: two observed downloads of the 1.33 GB m4b took 551s and
    # 521s, i.e. ~2.5 MB/s end to end, leaving under 50s of headroom before
    # nginx closed the connection. The largest book in the library is 1.59 GB
    # (House of Earth and Blood), which needs ~640s at that rate and would
    # have failed outright - the browser shows a dead or partial download
    # with no error, because nginx drops the connection rather than returning
    # a status.
    #
    # 6400 is 10x that ~640s requirement: enough slack for a phone on weak
    # wifi or several concurrent downloads sharing the same ~2.5 MB/s, while
    # still being a number derived from the measurement rather than an
    # arbitrary ceiling. No cost to the headroom - nginx tears the connection
    # down as soon as the client goes away, so this bounds only how slow a
    # download may legitimately be, not how long a dead socket lingers.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "6400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "6400"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # The OIDC callback returns with two JWTs in the query string, which nginx
    # forwards to Authelia as X-Forwarded-Uri. The default 4k/8k header buffers
    # overflow and the auth subrequest fails with 431.
    nginx.ingress.kubernetes.io/client-header-buffer-size: "16k"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 16k"
  homepage:
    enabled: true
    # No widgetType → chart emits gethomepage.dev/href instead of widget
    # annotations (the audiobookshelf widget needs an API token plumbed
    # through Vault + homepage-vars, not worth it for a href tile).
    displayName: Audiobookshelf
    description: Listen to and download audiobooks
    icon: audiobookshelf.png

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    # Downloads stream via Express res.download() (sendFile), so a 1.2 GB
    # m4b never buffers in memory the way autocaliweb's calibredb-export-
    # to-/tmp path does. 1Gi is ample.
    memory: 1Gi
