# In-namespace alias for the KEDA HTTP add-on's interceptor proxy
# (installed by app-of-apps/apps/keda.yaml), because an Ingress backend
# can only name a Service in its own namespace.
#
# Scale-to-zero routing: an opted-in app's Ingress points here instead of
# at the app's own Service. The interceptor matches the request's Host
# header against the app's InterceptorRoute rules, scales the workload
# 0 -> 1, and serves the route's cold-start placeholder (or holds the
# request) until a pod is ready, then forwards. See
# raw/shelfmark/scale-to-zero.yaml for the per-app half.
#
# The proxy listens on 8080 — a chart-internal fact, like the service
# name above. An ExternalName Service cannot remap ports, so every
# Ingress backend pointing here must say 8080, whatever port the app's
# own Service uses.
#
# A new sleeper also gets a line on the fleet dashboard: extend the
# regex roster in monitoring/grafanadashboard-scale-to-zero.yaml (one
# alternation per namespace, shared by its tiles and its history).
apiVersion: v1
kind: Service
metadata:
  name: keda-http-interceptor
  namespace: media
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
