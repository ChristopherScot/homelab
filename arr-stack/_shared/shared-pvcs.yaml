# Shared media volume — RWX NFS share on the NAS. Mounted as /media in
# qBittorrent, every *arr, and Jellyfin. Single mount = hardlinks work
# (qBit can hardlink the downloaded file into /media/movies/ without
# doubling disk usage on the NAS).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: synology-nfs
  resources:
    requests:
      storage: 2Ti
---
# Gluetun config — retired 2026-11-10, replaced by gluetun-config-longhorn
# below. Left here (Retain) like the other retired iSCSI claims; there is
# no LUN behind it any more.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluetun-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: synology-iscsi
  resources:
    requests:
      storage: 1Gi
---
# Gluetun config — servers.json (refetched on startup) and an auth dir;
# Proton creds live in the protonvpn-credentials Secret, so the contents
# are regenerable and nothing was migrated across.
#
# Longhorn, not synology-iscsi: the backing LUN vanished 2026-11-10 while
# the PVC and PV both still read Bound, hours after qbit's volume went the
# same way. See synology-csi-config/storageclasses.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluetun-config-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# *arr configs — moved to NFS. Names suffixed -nfs so the iSCSI versions
# (Retain) survive the cutover; we manually delete the LUNs in DSM after
# verifying the migration. Synology DSM has a hard cap on simultaneous
# iSCSI LUNs (~16-64 depending on model), and 8 small *arr LUNs eats most
# of the budget for nothing — the apps are single-writer SQLite and run
# fine on NFSv4.1 with proper byte-range locking.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-nfs
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: synology-nfs
  resources:
    requests:
      storage: 2Gi
---
# qBittorrent config — BT_backup fastresume files and download piece
# state. Was on synology-iscsi, the one app deliberately kept there for
# its I/O.
#
# Abandoned 2026-11-10: a node dropped during the wired migration and
# btrfs came back with `parent transid verify failed` on BOTH mirrors
# (state EA), remounting read-only on every fresh iSCSI session. There was
# no restore point — synology-iscsi has no CSI snapshot class in this
# cluster — so the 12.3M of BT_backup state was rsync'd off by hand.
# authelia/db.yaml records the same class remounting read-only on iSCSI
# hiccups, 2026-09-13.
#
# Longhorn's 3-replica block storage is the point. Don't move config back.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# *arr config PVCs live on Longhorn (block, 3-replica, low-latency) rather
# than NFS — SQLite workloads suffer 5-50ms per syscall on NFS. The
# previously-NFS-backed PVCs were retired after migration; underlying
# NAS shares are still on the Synology (reclaim=Retain) until manually
# deleted in DSM.
#
# bazarr-config-longhorn moved into the arr-app Helm chart — it's created
# by the chart's PVC template per the values.yaml in arr-stack/apps/bazarr/.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# readarr-config-longhorn moved into the arr-app Helm chart.
# sonarr-config-longhorn moved into the arr-app Helm chart.
# radarr-config-longhorn moved into the arr-app Helm chart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# autocaliweb's config PVC is RWO; supernote-shelf-sync co-locates via
# podAffinity to RO-mount it. Migrating to Longhorn keeps that working.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autocaliweb-config-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      # 5Gi filled up: processed_books/ keeps a backup copy of every
      # ingested book + originals + failed imports. 20Gi gives headroom.
      storage: 20Gi
---
# Calibre metadata PVC (referenced by autocaliweb's /calibre-metadata
# mount). Kept around even though calibre-web doesn't have a native
# split-library option — removing it would orphan that mount.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autocaliweb-metadata-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# Kavita config + DB. RWO because Kavita uses SQLite internally and
# benefits from local-disk performance.
# kavita-config-longhorn moved into the arr-app Helm chart.
# Ingest folder shared between Shelfmark (writes downloads here) and
# autocaliweb (watches and imports). RWX so both pods can mount it.
# Longhorn (block + share-manager) instead of synology-nfs because the
# Synology NFS class uses `actimeo=600` which caches directory entries
# for 10 minutes — autocaliweb's polling watcher sees ghost entries for
# deleted files and gets stuck in an ingest loop that starves the Flask
# web UI and triggers liveness probe failures → 503s on books.home.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: acw-ingest-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
# Calibre books library — RWO Longhorn. Was RWX (NFS-Ganesha
# share-manager) but every SQLite/file op from autocaliweb suffered
# 30–50 ms per pread, making the UI unusable. Now RWO; all consumers
# (autocaliweb, readarr, supernote-shelf-sync, webdav, kavita)
# colocate via podAffinity on whichever non-pop-os node Longhorn
# attaches this volume to.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: books-longhorn-rwo
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelfmark-config-nfs
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: synology-nfs
  resources:
    requests:
      storage: 1Gi
---
# Replaces shelfmark-config-nfs. Configs go on Longhorn (matches *arr
# convention); only bulk media stays on NFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelfmark-config-longhorn
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
# prowlarr-public-config-longhorn moved into the arr-app Helm chart.
---
# Audiobook library — separate from books-longhorn-rwo on purpose.
# autocaliweb's ingest processor hardcodes
# supported_audiobook_formats = {'m4b','m4a','mp4'} and imports anything
# matching into the Calibre library, so an audiobook that reaches the
# shared acw-ingest queue ends up as a Calibre entry. Both producers
# write here directly instead — shelfmark via DESTINATION_AUDIOBOOK and
# readarr via its on-import hook — so audiobooks never enter that queue.
# Calibre stays a pure ebook library, and Audiobookshelf gets a volume it
# can delete from.
# RWO for the same reason as books-longhorn-rwo: the RWX share-manager
# added 30-50 ms per pread. Consumers colocate via podAffinity.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobooks-longhorn-rwo
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
