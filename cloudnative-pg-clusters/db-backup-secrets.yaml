# S3 credentials for CNPG (Barman) continuous backup, for the clusters
# that did not already have them.
#
# Each namespace gets its own ServiceAccount, SecretStore and Vault role
# rather than borrowing the app's. Two reasons:
#
#   - shlink-redirector's Vault policy is GENERATED by homelabctl from
#     its config.yaml and grants only kv/shlink/*. A hand-edit to widen it
#     would be overwritten by the next `homelabctl vault --apply`.
#   - shlink-db is declared here, in cloudnative-pg-clusters/, not in the
#     redirector's config. The database is not the redirector's concern
#     and neither are its backup credentials.
#
# The Vault roles are in bootstrap/vault-policies.sh (cnpg-backup-<ns>),
# bound to the cnpg-backup ServiceAccount in each namespace so nothing
# else there can assume the grant.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-backup
  namespace: shlink
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-cnpg-backup
  namespace: shlink
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: cnpg-backup-shlink
          serviceAccountRef:
            name: cnpg-backup
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shlink-db-backup-s3
  namespace: shlink
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cnpg-backup
    kind: SecretStore
  target:
    name: shlink-db-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: cnpg-backups/s3, property: access_key_id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: cnpg-backups/s3, property: secret_access_key }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-backup
  namespace: monitoring
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-cnpg-backup
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: cnpg-backup-monitoring
          serviceAccountRef:
            name: cnpg-backup
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-db-backup-s3
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cnpg-backup
    kind: SecretStore
  target:
    name: grafana-db-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: cnpg-backups/s3, property: access_key_id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: cnpg-backups/s3, property: secret_access_key }
