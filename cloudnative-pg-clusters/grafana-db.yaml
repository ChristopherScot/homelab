# Postgres backend for the local Grafana, replacing the fragile
# SQLite-on-Longhorn setup. 2 instances so a node/storage blip fails over
# instead of wedging (the SQLite failure mode on 2026-05-19). CNPG
# generates a `grafana-db-app` secret with connection creds in the
# monitoring namespace.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: monitoring
spec:
  instances: 2
  monitoring:
    enablePodMonitor: true
  storage:
    # 10Gi, not 2Gi. At 2Gi the volume held 5.1GiB actual: the default
    # Longhorn recurring job snapshots every 6h and retains 8, and this
    # database was writing enough that each snapshot captured ~650MB. The
    # chain outgrew the volume, and CNPG then refused to start Postgres at
    # all - "Detected low-disk space condition, avoid starting the
    # instance" - which is the right call, and left Grafana without a
    # backend from 2026-09-16 until this was raised.
    size: 10Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: grafana
      owner: grafana

  # Continuous backup to S3, same shared creds and pattern as
  # vaultwarden-db and paperless-db. See shlink-db.yaml for why: a
  # Longhorn volume backup dies with its volume, an object store does
  # not.
  backup:
    barmanObjectStore:
      destinationPath: "s3://cscot-homelab-pg-backups/grafana"
      s3Credentials:
        accessKeyId:
          name: grafana-db-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: grafana-db-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
    retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-db-daily
  namespace: monitoring
spec:
  # CNPG 6-field cron (sec min hour dom mon dow) - 05:00 daily, staggered
  # off vaultwarden (04:30) and shlink (04:45).
  schedule: "0 0 5 * * *"
  backupOwnerReference: self
  cluster:
    name: grafana-db
