# Kaneo credentials for the pods and the reconcile CronJob, from Vault
# kv/claude-pods/kaneo.
#
#   api-key        the pods use it to read the board and move cards
#   webhook-secret the reconcile CronJob signs its /reconcile POST with it
#
# The dispatcher reads the same Vault path through its own ExternalSecret,
# rendered from services/kaneo-dispatcher/config.yaml, so nothing here is
# mounted by it. Two secrets rather than one so a consumer of one never
# mounts the other. Seed both with:
#
#   vault kv put kv/claude-pods/kaneo \
#     api-key="<Settings -> API keys in Kaneo>" \
#     webhook-secret="$(openssl rand -hex 32)"
#
# Under claude-pods/ rather than a kaneo/ path of its own: the
# claude-pods Vault role is scoped to kv/data/claude-pods/*, and these are
# the pods' credentials for a service they consume, not Kaneo's own
# secrets (those live in kv/kaneo and are read by Kaneo in its namespace).
# Putting them here needs no new role.
#
# The webhook-secret must match what is configured on the project's generic
# webhook integration in Kaneo, or every delivery is rejected as unsigned.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kaneo-api
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-claude-pods
    kind: SecretStore
  target:
    name: kaneo-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef: { key: claude-pods/kaneo, property: api-key }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kaneo-webhook
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-claude-pods
    kind: SecretStore
  target:
    name: kaneo-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook-secret
      remoteRef: { key: claude-pods/kaneo, property: webhook-secret }
