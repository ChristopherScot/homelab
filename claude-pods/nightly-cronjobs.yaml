# RBAC for the claude-pods jobs.
#
# This file used to carry the nightly ticket-to-PR pipeline as well:
# nightly-author (00:00), nightly-test (02:00) and nightly-merge (04:00),
# three CronJobs that kubectl-exec'd scripts in the session pods. They were
# suspended on 2026-11-01 and removed on 2026-11-10; the work is hook-driven
# now. `git log` has the reasoning behind the three-pod split if it is ever
# wanted again -- chiefly that a reviewer who has just argued for a change
# will defend it, so the merging pod never saw the authoring pod's argument.
#
# What remains is the ServiceAccount and its Role, which session-sleep-cron
# and kaneo-dispatcher still bind to. The scripts themselves
# (stage-author.sh, stage-test.sh, stage-merge.sh) are still in the
# image and still tested; nothing schedules them.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nightly-runner
  namespace: claude-pods
---
# Only what the trigger needs: find the pod, exec one script in it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nightly-runner
  namespace: claude-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # The dispatcher wakes the session StatefulSet before an exec and the
  # session-sleep cron puts it back. get and the scale writes are
  # name-scoped so nightly-runner cannot scale desloppify, which shares
  # this namespace; `kubectl rollout status` also WATCHes the object, and
  # RBAC cannot scope list/watch by resourceName, so those two are
  # namespace-wide.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["claude-session"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["claude-session"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nightly-runner
  namespace: claude-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nightly-runner
subjects:
  - kind: ServiceAccount
    name: nightly-runner
    namespace: claude-pods
