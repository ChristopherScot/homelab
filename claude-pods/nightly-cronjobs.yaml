# Nightly ticket→PR pipeline, split across the three session pods.
#
#   00:00  pod 0  reads open issues, writes fixes, runs a 4-reviewer panel
#                 for 3 rounds, opens PRs. Never merges.
#   02:00  pod 2  RUNS the software the PR changes — CLIs, services, UIs
#                 via agent-browser, manifests via kubectl/helm/tofu — and
#                 checks it does what the PR, the comments and the issue
#                 claim. Files an issue per reproduced bug and publishes a
#                 TESTED: PASS/FAIL/BLOCKED verdict as a PR label. Fixes
#                 nothing. These tests are manual and non-deterministic, so
#                 they cannot live in CI — this is the only place that
#                 signal exists.
#   04:00  pod 1  takes a COLD look at those PRs — fresh clone, no sight of
#                 pod 0's reasoning — and merges only on a unanimous panel
#                 pass, green CI, AND pod 2's tested-pass label. No verdict
#                 means untested, which is not approved.
#
# Why separate pods rather than one job doing all three: a reviewer that
# has just argued for a change will defend it. Pod 1's panel has never
# seen that argument, so its agreement is worth something. And "is this
# good code?" (pod 1) is a different question from "where does it break?"
# (pod 2) — bundled, the second gets answered carelessly once the first
# looks fine. Each stage also skips any branch touched in the last 30
# minutes, so none of them judges a diff that is still moving.
#
# These CronJobs hold no logic themselves — they kubectl-exec the scripts
# baked into the pod image, so the work runs inside the session pod with
# its PVC, its Vault-mounted token, and its ~/.claude skills and agents.
#
# NOTE: these run unattended, which is a departure from the premise in
# rbac.yaml that a human is always in the loop. Infrastructure work is in
# scope by design — the pods keep cluster-admin and are asked to express
# changes as manifests Argo reconciles. What stays out of scope is the
# irreversible: deleting Retain-policy volumes, dropping databases,
# force-pushing shared branches. Those get proposed in the PR body.
# Merges are gated on green CI as well as the review panel, but the
# standing risk is real: review agents have been confidently wrong before.
# PRs that fail the gate are left open and commented rather than merged.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nightly-runner
  namespace: claude-pods
---
# Only what the trigger needs: find the pod, exec one script in it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nightly-runner
  namespace: claude-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nightly-runner
  namespace: claude-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nightly-runner
subjects:
  - kind: ServiceAccount
    name: nightly-runner
    namespace: claude-pods
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-author
  namespace: claude-pods
spec:
  schedule: "0 0 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      # Hard ceiling on the whole run: pod 1 looks at 04:00, so pod 0 must
      # be finished well before then regardless of how the work goes.
      activeDeadlineSeconds: 6600
      template:
        spec:
          serviceAccountName: nightly-runner
          restartPolicy: Never
          containers:
            - name: trigger
              # registry.k8s.io is upstream and keeps its version tags.
              # bitnami/kubectl:1.30 was deleted from Docker Hub, so every
              # job sat in ImagePullBackOff until its deadline killed it —
              # three silent failures a night, reported as DeadlineExceeded
              # rather than as a missing image.
              #
              # No `sh -c` wrapper: this image's entrypoint IS kubectl and
              # it ships no shell, so a shell form exits 128 before running.
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - exec
                - -n
                - claude-pods
                - claude-session-0
                - --
                - /usr/local/bin/nightly-author
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-test
  namespace: claude-pods
spec:
  schedule: "0 2 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      # Must finish before pod 1 looks at 04:00, so its findings are on
      # the PR when the merge decision is made.
      activeDeadlineSeconds: 6600
      template:
        spec:
          serviceAccountName: nightly-runner
          restartPolicy: Never
          containers:
            - name: trigger
              # registry.k8s.io is upstream and keeps its version tags.
              # bitnami/kubectl:1.30 was deleted from Docker Hub, so every
              # job sat in ImagePullBackOff until its deadline killed it —
              # three silent failures a night, reported as DeadlineExceeded
              # rather than as a missing image.
              #
              # No `sh -c` wrapper: this image's entrypoint IS kubectl and
              # it ships no shell, so a shell form exits 128 before running.
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - exec
                - -n
                - claude-pods
                - claude-session-2
                - --
                - /usr/local/bin/nightly-test
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-merge
  namespace: claude-pods
spec:
  schedule: "0 4 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      template:
        spec:
          serviceAccountName: nightly-runner
          restartPolicy: Never
          containers:
            - name: trigger
              # registry.k8s.io is upstream and keeps its version tags.
              # bitnami/kubectl:1.30 was deleted from Docker Hub, so every
              # job sat in ImagePullBackOff until its deadline killed it —
              # three silent failures a night, reported as DeadlineExceeded
              # rather than as a missing image.
              #
              # No `sh -c` wrapper: this image's entrypoint IS kubectl and
              # it ships no shell, so a shell form exits 128 before running.
              image: registry.k8s.io/kubectl:v1.30.14
              args:
                - exec
                - -n
                - claude-pods
                - claude-session-1
                - --
                - /usr/local/bin/nightly-merge
