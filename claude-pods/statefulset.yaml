# Two interactive Claude Code sessions (claude-session-0 / -1) for parallel
# multitasking. StatefulSet so each replica gets its own stable workspace PVC
# (separate repo clones + Claude login state → no git/state collisions).
#
# Usage: kubectl exec -it -n claude-pods claude-session-0 -- bash
#        then `claude`, then `/remote-control` to drive from phone/web.
#
# Asleep (0 replicas) when idle — see session-sleep-cron.yaml. The
# dispatcher wakes the set before an exec; to attach interactively, wake
# it yourself first:
#   kubectl scale sts claude-session -n claude-pods --replicas=3
# It stays awake while any pod holds the run lock, has a non-rc tmux
# session, or saw phone remote-control activity in the last 30 minutes.
# Interactive work must live in tmux (rclaude's layout does): a bare
# `kubectl exec -it ... bash` emits none of those signals and the sleep
# cron will scale the set away under it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude-session
  namespace: claude-pods
spec:
  serviceName: claude-session
  # No replicas: field — the dispatcher scales this to 3 before an exec
  # and the session-sleep cron scales it to 0 when idle; a value here
  # would make Argo selfHeal fight both. Initial creation defaults to 1;
  # the first dispatch or sleep cycle settles it.
  #
  # partition at 3 means no running pod is ever updated in place: a
  # rolling update touches ordinals >= partition, and the highest here
  # is 2. A new image digest -- argocd-image-updater writes one within
  # ~5 minutes of a build -- would otherwise terminate each pod in turn
  # with a 30s grace period, and since the stage scripts do not handle
  # SIGTERM an hour-long run dies mid-edit, leaving its card In Progress
  # until reconcile's hours-stale threshold notices.
  #
  # The strategy stays RollingUpdate, which is what makes this work: a
  # scale-up creates pods at updateRevision (the new image), while
  # partition holds back in-place updates. OnDelete would do the
  # opposite -- scale-ups create at currentRevision, so a new image
  # would never arrive without deleting a pod by hand.
  #
  # So the roll becomes the teardown these pods already have:
  # session-sleep scales the set to 0 only when no pod holds
  # /tmp/nightly.lock, has a tmux client attached, or woke in the last
  # 900s, and the dispatcher's next wake starts them on the new image.
  #
  # 3 is 1 + the highest ordinal in dispatch.mjs's ROUTES, the same
  # derivation as its WAKE_REPLICAS. It is written out here because the
  # dispatcher's RBAC grants statefulsets/scale but not statefulsets,
  # and widening that to patch this one field would hand it the whole
  # pod spec. Adding a fourth stage to ROUTES means changing this too.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 3
  selector:
    matchLabels:
      app: claude-session
  template:
    metadata:
      labels:
        app: claude-session
    spec:
      serviceAccountName: claude-session
      # Private ghcr image — pull secret from the ghcr-pull ExternalSecret.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000
      containers:
        - name: claude
          image: ghcr.io/christopherscot/claude-pod:latest
          # Digest-pinned by argocd-image-updater on the live Application (see kustomization.yaml); pull-on-change, cache otherwise.
          imagePullPolicy: IfNotPresent
          # Wire git HTTPS push creds, pre-clone any repos listed in
          # CLONE_REPOS, then idle. You exec in, start `claude`, then
          # /remote-control.
          command:
            # Boot orchestration baked into the image (claude-pods/entrypoint.sh).
            # -lc gives a login shell (PATH etc) before exec-ing the script.
            - bash
            - -lc
            - exec /usr/local/bin/entrypoint
          env:
            - name: HOME
              value: /home/node
            # Engineer who owns these pods — used by `dp <tag>` to deploy to
            # webapp--$OWNER. Per-employee envs would set this per-pod (e.g.
            # from the per-ordinal Vault secret) in the multi-user future.
            - name: OWNER
              value: "chris"
            # Per-pod repo lists come from the Vault-backed claude-repos secret
            # (mounted at /run/secrets/repos/pod<ordinal>), not env, so repo
            # names stay out of this repo.
            # Git identity for commits made from these sessions.
            - name: GIT_AUTHOR_NAME
              value: "Chris (claude-pod)"
            - name: GIT_COMMITTER_NAME
              value: "Chris (claude-pod)"
            # Email from the claude-git-identity ExternalSecret (Vault-backed),
            # not hardcoded here. optional:true so pods still boot if the Vault
            # `email` property isn't set yet (commits just lack an email until).
            - name: GIT_AUTHOR_EMAIL
              valueFrom:
                secretKeyRef:
                  name: claude-git-identity
                  key: email
                  optional: true
            - name: GIT_COMMITTER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: claude-git-identity
                  key: email
                  optional: true
            # Kernel (kernel.sh) API key for `kbrowser` cloud browsers. From the
            # kernel-api ExternalSecret (Vault-backed). Optional so pods still
            # boot before the Vault path is populated; `kbrowser` then falls back
            # to ~/.config/kernel/api-key.
            - name: KERNEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kernel-api
                  key: api_key
                  optional: true
          volumeMounts:
            # $HOME on the SSD tier — latency-sensitive (interactive shell,
            # zsh history fsyncs, nvim state, Claude login). On the HDD tier
            # this caused severe typing lag (~41s for 50 synced writes).
            - name: home
              mountPath: /home/node
            # /workspace on the HDD capacity tier — bulk, re-clonable repos,
            # not latency-sensitive.
            - name: workspace
              mountPath: /workspace
            # GitHub token for push (mounted from secret) — sessions source it.
            - name: git-creds
              mountPath: /run/secrets/git
              readOnly: true
            # GCP deploy key (SA) for ephemeral deploys.
            - name: gcp-deploy
              mountPath: /run/secrets/gcp
              readOnly: true
            # Per-pod repo lists (Vault-backed; pod<ordinal> files).
            - name: repos
              mountPath: /run/secrets/repos
              readOnly: true
            # Kaneo API key — the board is the work queue, so the nightly
            # scripts read and move cards with this.
            - name: kaneo-api
              mountPath: /run/secrets/kaneo
              readOnly: true
            # Claude subscription tokens, shared with the desloppify pod
            # from kv/claude-pods/claude. preflight_credential prefers
            # these over ~/.claude/.credentials.json, which is the file
            # that keeps arriving blanked with expiresAt=0. entrypoint.sh
            # is what calls it; it did not until 2026-11-12, so this
            # mount sat unread and every RC session said "Not logged in".
            - name: claude-oauth
              mountPath: /run/secrets/claude
              readOnly: true
          # Requests are a SCHEDULING RESERVATION, not a quota: 500m CPU
          # was held against ~5m actual use, so three pods parked 1.5
          # cores the scheduler could not give anything else. There is
          # deliberately no CPU limit, so a nightly run still bursts to
          # whatever the node has spare — the request only sets the floor
          # under contention.
          #
          # Memory is the opposite: 2Gi is a hard ceiling and exceeding it
          # is an OOM kill, so it stays. Observed steady state is ~300Mi,
          # and nothing has been OOM-killed, but a build plus a browser
          # plus a Go test run is the spike worth keeping headroom for.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: git-creds
          secret:
            secretName: claude-git-creds
        - name: gcp-deploy
          secret:
            secretName: gcp-deploy
            optional: true
        - name: repos
          secret:
            secretName: claude-repos
            optional: true
        - name: kaneo-api
          secret:
            secretName: kaneo-api
            # optional, like the others: a pod that starts before the
            # ExternalSecret has synced should come up and fail its own
            # preflight with a clear message, not sit in
            # CreateContainerConfigError where the reason is three kubectl
            # commands away.
            optional: true
        - name: claude-oauth
          secret:
            secretName: claude-oauth
            # Same reasoning: a pod without it falls back to
            # ~/.claude/.credentials.json rather than failing to start.
            optional: true
  volumeClaimTemplates:
    # $HOME — SSD (1 replica). Small + latency-sensitive; the interactive
    # experience lives here. Single replica keeps SSD usage modest.
    #
    # 15Gi, not the original 5Gi: on 2026-11-12 pod2 hit 100% and the
    # failure was indirect. Claude Code could not write its session
    # transcript (ENOSPC), the agent exited non-zero AFTER finishing its
    # work and reaching PASS, and stage-test read that exit code as "the
    # pod could not run this" - parking a passing card in
    # needs-human-review as BLOCKED. A full disk reads as a broken
    # ticket.
    #
    # What filled it was all regenerable: go/pkg 1.9G, .npm 1.8G,
    # .cache/go-build 1.2G, against .claude at 99M. prune_build_caches
    # in lib/pod-common.sh now drops those when a stage ends with this
    # filesystem under pressure, so this size is headroom, not the fix.
    #
    # The live PVCs are already 15Gi. They were patched directly:
    #   kubectl patch pvc home-claude-session-N -n claude-pods \
    #     -p '{"spec":{"resources":{"requests":{"storage":"15Gi"}}}}'
    #
    # This stays 5Gi, and the mismatch is deliberate. volumeClaimTemplates
    # are immutable: the API does not ignore an edit here, it REJECTS the
    # whole StatefulSet with "updates to statefulset spec for fields other
    # than 'replicas', 'ordinals', 'template', 'updateStrategy',
    # 'persistentVolumeClaimRetentionPolicy' and 'minReadySeconds' are
    # forbidden". This app auto-syncs, so writing 15Gi here does not
    # document reality - it wedges the Application at SyncFailed, and
    # argocd-image-updater pins the pod image on this same Application,
    # so the next image roll would stop landing with no obvious cause.
    #
    # Raising it for real means recreating the StatefulSet
    # (kubectl delete sts claude-session --cascade=orphan, at 0 replicas,
    # with persistentVolumeClaimRetentionPolicy checked first) - a
    # deliberate operation, not a line in a bugfix PR.
    # tests/statefulset-appliable.sh keeps this honest.
    - metadata:
        name: home
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-single-ssd
        resources:
          requests:
            storage: 5Gi
    # /workspace — HDD capacity tier (1 replica). Bulk, re-clonable repos.
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-hdd-single
        resources:
          requests:
            storage: 10Gi
