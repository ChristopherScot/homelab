# The Kaneo dispatcher: receives a webhook when a card changes column and
# kubectl-execs the matching script in the matching session pod.
#
# At the top level, not in dispatcher/, because the Argo Application for
# this directory is non-recursive: a manifest in a subdirectory is skipped
# silently, which would leave the dispatcher undeployed and nothing saying
# so. Only its source (dispatch.mjs) lives in dispatcher/, where Argo
# ignores it for the opposite and correct reason — it is not YAML.
#
# This replaced the three nightly cronjobs, which were suspended 2026-11-01
# and removed 2026-11-10. There is no clock fallback any more: if this
# dispatcher is down, nothing advances the board. The scripts it execs are
# unchanged and still in the image, so re-adding CronJobs is possible, but
# nightly-merge.sh carries the open bugs in #63/#67/#68 and should not be
# put back on a schedule without reading them.
#
# Runs in the same image as the session pods: it needs node (it is a node
# script) and kubectl (it execs with it), and that image already carries
# both with the right versions. A second image would be a second thing to
# keep in step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo-dispatcher
  namespace: claude-pods
  labels:
    app: kaneo-dispatcher
spec:
  replicas: 1
  # Exactly one. The in-process `busy` set is what stops two runs racing on
  # a repo's shared clone, and it is per-process: a second replica would
  # have its own, see an idle repo, and start a run that git-resets the
  # tree under the first one. Recreate rather than RollingUpdate for the
  # same reason — no overlap during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kaneo-dispatcher
  template:
    metadata:
      labels:
        app: kaneo-dispatcher
      annotations:
        # Restart when the webhook secret rotates, so a changed secret does
        # not leave the receiver verifying against the previous one.
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: nightly-runner
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: dispatcher
          image: ghcr.io/christopherscot/claude-pod:latest
          command: ["node", "/usr/local/share/claude-pods/dispatcher/dispatch.mjs"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DISPATCH_NS
              value: claude-pods
            # In-cluster Service: the webhook payload does not carry a
            # card's labels, so the repo: label is read back from the API.
            - name: KANEO_API_URL
              value: http://kaneo.kaneo.svc.cluster.local:5173
          volumeMounts:
            # Both the webhook secret (to verify deliveries) and the API
            # key (to read a card's labels) live under this path.
            - name: kaneo-webhook
              mountPath: /run/secrets/kaneo
              readOnly: true
            # Which repos each pod works. Read to avoid dispatching a repo
            # a pod does not handle, which would run a job that scans the
            # wrong set and exits having done nothing.
            - name: repos
              mountPath: /run/secrets/repos
              readOnly: true
            # The reconcile sweep asks GitHub whether a card's work
            # already exists — a branch, a commit status, a merge — before
            # re-dispatching it. Without a token every one of those
            # lookups fails and the sweep can do nothing but report
            # errors.
            - name: git-creds
              mountPath: /run/secrets/git
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: kaneo-webhook
          projected:
            sources:
              - secret:
                  name: kaneo-webhook
              - secret:
                  name: kaneo-api
        - name: repos
          secret:
            secretName: claude-repos
            optional: true
        - name: git-creds
          secret:
            secretName: claude-git-creds
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: kaneo-dispatcher
  namespace: claude-pods
spec:
  selector:
    app: kaneo-dispatcher
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Kaneo posts here when a card changes column.
#
# No Authelia on this one, deliberately: the caller is Kaneo's webhook
# sender, which cannot complete a login redirect. It authenticates with an
# HMAC over the raw body instead (X-Kaneo-Signature), which the receiver
# verifies before doing anything — see dispatch.mjs. An unsigned or
# wrongly-signed request is answered 401 and nothing runs.
#
# ingressClassName "external" is the LAN controller (192.168.50.225), not
# the internet-facing one — that is the class named "public". The host is
# reachable from the LAN only.
#
# Kaneo itself does not use this path: it posts to the in-cluster Service
# (kaneo-dispatcher.claude-pods.svc) because cluster DNS does not resolve
# *.home.chrisscotmartin.com, and hairpinning out to the ingress and back
# would add a dependency on the LAN for traffic that never leaves the
# cluster. This ingress exists for reaching /healthz by hand.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaneo-dispatcher
  namespace: claude-pods
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  labels:
    app: kaneo-dispatcher
spec:
  ingressClassName: external
  tls:
    - hosts: [dispatch.home.chrisscotmartin.com]
      secretName: kaneo-dispatcher-tls
  rules:
    - host: dispatch.home.chrisscotmartin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kaneo-dispatcher
                port:
                  number: 8080
