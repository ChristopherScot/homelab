# Credentials for the desloppify pod, from Vault.
#
# Kept as their own ExternalSecrets rather than merged into
# claude-git-creds: that secret holds a token with broad access to the
# homelab repos, and this pod must have neither that token nor anything
# like it. The whole guarantee that it cannot reach main rests on its
# credential being narrow, so the two must not share a secret that a
# future edit could widen.
---
# The existing SecretStore is scoped to kv/claude-pods. The GitHub PAT
# lives at kv/github/app-agent-access, so it needs a store of its own
# rather than a path this one cannot reach.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-github
  namespace: claude-pods
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: claude-pods
          serviceAccountRef:
            name: external-secrets-sa
---
# Fine-grained PAT, scoped to schoolhouse-world/app alone, with Contents
# and Pull requests write and NO Administration scope. Verified by
# verify-token-scope.sh, which the runner's preflight repeats: it refuses
# to start if the token can read main's branch protection.
#
# Vault: kv/github/app-agent-access
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: desloppify-git
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-github
    kind: SecretStore
  target:
    name: desloppify-git
    template:
      type: Opaque
      data:
        token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef: { key: github/app-agent-access, property: token }
---
# Claude subscription token from `claude setup-token`, valid one year.
# The Agent SDK spawns the claude binary, which reads this; an
# ANTHROPIC_API_KEY in the environment would silently outrank it and bill
# per token against the API account, so the runner unsets both.
#
# Vault: kv/claude-pods/desloppify (property: claude_oauth_token)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: desloppify-claude
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-claude-pods
    kind: SecretStore
  target:
    name: desloppify-claude
    template:
      type: Opaque
      data:
        oauth-token: "{{ .oauth_token }}"
  data:
    - secretKey: oauth_token
      remoteRef: { key: claude-pods/desloppify, property: claude_oauth_token }
