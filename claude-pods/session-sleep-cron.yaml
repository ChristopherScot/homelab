# Puts the claude-session StatefulSet to sleep when nothing is using it.
#
# Not KEDA: these pods wake on Kaneo card moves, not on a clock (no cron
# window fits) and receive no HTTP (nothing for the interceptor to see).
# The dispatcher is the wake (ensureAwake in dispatcher/dispatch.mjs:
# scale to 3, wait ready, exec); this cron is the matching sleep.
#
# "In use" is four different things, checked per existing pod:
#   - a dispatched run holds /tmp/nightly.lock — the same flock the
#     dispatcher checks before starting one
#   - a tmux session other than `rc` exists, attached or NOT: a detached
#     tmux with an agent running in it is still work
#   - the `rc` session was ACTIVE in the last 30 minutes. rc exists on
#     every pod from boot (entrypoint.sh starts the phone remote-control
#     loop in it), so its mere presence says nothing — but driving it
#     from the phone produces output, which advances #{session_activity}.
#     Judging rc by presence would make this cron a no-op forever;
#     judging it by staleness protects live phone work and nothing else.
#   - a pod younger than 15 minutes may belong to a dispatch that has
#     not taken the lock yet (the dispatcher's 600s wake wait plus exec
#     lag fits inside 900s), so a fresh set is left alone
# Any one of them keeps the whole set awake: ROUTES pins stages to pods
# by ordinal and a StatefulSet cannot run ordinal 2 without 0 and 1, so
# sleep is all-or-nothing by construction.
#
# The probe is one exec that must POSITIVELY print "idle" — an exec that
# errors, a pod that can't be reached, or any surprise prints nothing and
# reads as busy. Same fail-closed rule as the dispatcher's podIsBusy.
#
# The race this does NOT close: a dispatch landing on a long-awake set
# between this job's last idle probe and its scale-to-0 dies with the
# pods. Deliberate: that window is seconds wide per half-hour tick, and
# the kaneo reconcile sweep re-dispatches the card — hourly sweep, cards
# picked up once ~4h stale (RECONCILE_STALE_MS), so recovery is slow but
# certain. Don't add a lock here to "fix" it, and don't widen the age
# guard for it — the guard covers a different window (wake to first
# flock).
#
# A bare `kubectl exec -it ... bash` shell is NOT one of the four
# signals — interactive work must live in tmux (rclaude does this) or
# the set will be scaled away under it. statefulset.yaml says the same.
#
# Same image as the session pods, same reasoning as kaneo-reconcile: the
# script needs a shell and kubectl, and that image already carries both.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: session-sleep
  namespace: claude-pods
spec:
  schedule: "*/30 * * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Scaling to 0 is idempotent and the checks are read-only, so a
      # retry after a transient API error is safe.
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: nightly-runner
          restartPolicy: Never
          # Private ghcr image — without this the pull is anonymous and
          # fails 401. kaneo-reconcile carries the same block for the
          # same reason; its comment records the incident.
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sleep
              image: ghcr.io/christopherscot/claude-pod:latest
              # Digest-pinned by argocd-image-updater via kustomization.yaml; pull-on-change, cache otherwise.
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  ns=claude-pods
                  pods=$(kubectl get pods -n $ns -l app=claude-session -o jsonpath='{.items[*].metadata.name}')
                  if [ -z "$pods" ]; then
                    echo "already asleep"
                    exit 0
                  fi
                  now=$(date +%s)
                  for pod in $pods; do
                    created=$(kubectl get pod -n $ns "$pod" -o jsonpath='{.metadata.creationTimestamp}')
                    age=$(( now - $(date -d "$created" +%s) ))
                    if [ "$age" -lt 900 ]; then
                      echo "$pod is ${age}s old; a wake may be mid-dispatch"
                      exit 0
                    fi
                    state=$(kubectl exec -n $ns "$pod" -- sh -c '
                      flock -n /tmp/nightly.lock true || exit 0
                      tmux list-sessions -F "#{session_name} #{session_activity} #{session_attached}" 2>/dev/null |
                        awk -v now="$(date +%s)" "
                          \$3 != 0 { busy=1 }
                          \$1 != \"rc\" { busy=1 }
                          \$1 == \"rc\" && now - \$2 < 1800 { busy=1 }
                          END { if (!busy) print \"idle\" }
                        "
                    ' 2>/dev/null) || true
                    if [ "$state" != "idle" ]; then
                      echo "$pod busy or unreachable; leaving awake"
                      exit 0
                    fi
                  done
                  echo "all session pods idle; scaling to 0"
                  kubectl scale statefulset claude-session -n $ns --replicas=0
