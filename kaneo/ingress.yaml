# Split-auth, same shape as picoshare:
#
#   - the UI is behind Authelia, so the browser session is the household
#     login and Kaneo's own registration can stay closed.
#   - /api is NOT behind Authelia. The pods authenticate to it with a
#     device-code bearer token, and Authelia would reject those requests
#     with a redirect to a login page a pod cannot complete. Kaneo
#     authenticates /api itself — it is the same surface Kaneo Cloud
#     exposes publicly — so this is not an unauthenticated hole.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaneo-api
  namespace: kaneo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  labels:
    app: kaneo
spec:
  ingressClassName: external
  tls:
    - hosts: [kaneo.home.chrisscotmartin.com]
      secretName: kaneo-tls
  rules:
    - host: kaneo.home.chrisscotmartin.com
      http:
        paths:
          # Bearer-token API, the MCP endpoint (/api/mcp) and the
          # device-auth + OAuth discovery routes the pods use to get a
          # token in the first place.
          - path: /api
            pathType: Prefix
            backend: { service: { name: kaneo, port: { number: 5173 } } }
          - path: /.well-known
            pathType: Prefix
            backend: { service: { name: kaneo, port: { number: 5173 } } }
---
# The UI — Authelia-gated.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaneo-web
  namespace: kaneo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.home.chrisscotmartin.com/?rd=$scheme://$host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Method $request_method;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header X-Forwarded-For $remote_addr;
    nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Name,Remote-Email,Remote-Groups"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Kaneo"
    gethomepage.dev/description: "Project board — what the pods work on"
    gethomepage.dev/group: "Productivity"
    gethomepage.dev/icon: "mdi-view-dashboard-outline"
  labels:
    app: kaneo
spec:
  ingressClassName: external
  tls:
    - hosts: [kaneo.home.chrisscotmartin.com]
      secretName: kaneo-tls
  rules:
    - host: kaneo.home.chrisscotmartin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: kaneo, port: { number: 5173 } } }
