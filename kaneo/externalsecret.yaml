# AUTH_SECRET and NOTIFICATION_SECRET_ENCRYPTION_KEY from Vault
# (kv/kaneo). Both must stay stable across restarts: the first signs
# sessions, the second encrypts stored notification tokens, so a new
# value logs everyone out / orphans what it protected.
#
# Per-app SecretStore + Vault role, the convention every other app here
# follows. Role `kaneo` is declared in bootstrap/vault-policies.sh.
#
# Seed the values once with:
#   vault kv put kv/kaneo \
#     auth-secret="$(openssl rand -hex 32)" \
#     notification-key="$(openssl rand -hex 32)"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: kaneo
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-kaneo
  namespace: kaneo
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kaneo
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kaneo-auth
  namespace: kaneo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kaneo
    kind: SecretStore
  target:
    name: kaneo-auth
    creationPolicy: Owner
  data:
    - secretKey: auth-secret
      remoteRef: { key: kaneo, property: auth-secret }
    - secretKey: notification-key
      remoteRef: { key: kaneo, property: notification-key }
