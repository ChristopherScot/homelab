apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: 'v1.11.0'
    helm:
      parameters:
        - name: installCRDs
          value: 'true'
      values: |
        # Scrape metrics via Grafana Alloy annotation auto-discovery.
        # Powers the certificate-expiring-soon alert.
        prometheus:
          enabled: true
          servicemonitor:
            enabled: false  # using Alloy annotation autodiscovery, not ServiceMonitor
        podAnnotations:
          k8s.grafana.com/scrape: "true"
          k8s.grafana.com/metrics.portName: "http-metrics"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true