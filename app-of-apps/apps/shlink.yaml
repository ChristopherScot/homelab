# Shlink URL shortener — API + redirect engine + web UI, backed by the
# shlink-db CNPG Postgres cluster. Replaces the old Lambda/DynamoDB/S3/
# nginx-shim shortener.
#
# The `go` short-URL host is served by shlink-redirector, which has its
# own Application (app-of-apps/apps/shlink-redirector.yaml) generated by
# homelabctl. The image-updater annotations that used to live here moved
# with it - they tracked the redirector's image, not shlink's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shlink
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ChristopherScot/homelab
    targetRevision: HEAD
    path: shlink
  destination:
    server: https://kubernetes.default.svc
    namespace: shlink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
