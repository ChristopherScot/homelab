# Shlink URL shortener — API + redirect engine + web UI, backed by the
# shlink-db CNPG Postgres cluster. Replaces the old Lambda/DynamoDB/S3/
# nginx-shim shortener.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shlink
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # argocd-image-updater watches the redirector image on GHCR and, when
    # a new :latest digest appears, commits an image bump to
    # shlink/redirector.yaml (write-back method: git). Argo then syncs
    # the new manifest, rolling the deployment. `digest` strategy tracks
    # the current-latest digest sans re-tagging so any push to :latest
    # triggers a redeploy.
    argocd-image-updater.argoproj.io/image-list: redirector=ghcr.io/christopherscot/go-shlink-redirector
    # digest strategy: watch the sha256 of ghcr's `:latest` tag; a new
    # digest triggers a redeploy without changing the image string in
    # deployment.yaml. Manifest stays `image: …:latest`; the redeploy is
    # driven by Argo's parameter override (write-back-method: argocd).
    argocd-image-updater.argoproj.io/redirector.update-strategy: digest
    argocd-image-updater.argoproj.io/redirector.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChristopherScot/homelab
    targetRevision: HEAD
    path: shlink
  destination:
    server: https://kubernetes.default.svc
    namespace: shlink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
