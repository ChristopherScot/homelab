# Argo CD Image Updater — watches container registries for new tags/digests
# of images referenced by Argo Applications and writes the resolved digest
# onto the live Application (write-back-method: argocd, not git; see
# _homelabctl-services.yaml, claude-pods.yaml, desloppify-pod.yaml).
# Enrolment is annotations on the Application itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.13.0
    helm:
      releaseName: argocd-image-updater
      values: |
        config:
          argocd:
            grpcWeb: true
            serverAddress: argocd-server.argocd.svc:443
            insecure: false
            plainText: false
        # Poll interval — 5m keeps GHCR usage very low.
        extraArgs:
          - --interval
          - 5m
        # Log at info so first-time debugging is easy; drop to warn once
        # updates are proven.
        log:
          level: info
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
