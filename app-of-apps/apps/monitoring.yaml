# Kubernetes monitoring via the grafana/k8s-monitoring helm chart (v4) —
# Alloy collectors ship pod logs, cluster events, and cluster metrics to
# the in-cluster VictoriaMetrics + Loki destinations. Grafana Cloud was
# retired; this stack is local-only now.
#
# Chart shape: `destinations:` (object map) + per-feature `enabled` and
# `collector` blocks; collectors must be explicitly enabled too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    # 1. ServiceAccount, SecretStore, ExternalSecret for pulling the token.
    - repoURL: https://github.com/ChristopherScot/homelab.git
      targetRevision: HEAD
      path: monitoring
    # 2. The Grafana k8s-monitoring chart, fed values inline.
    - repoURL: https://grafana.github.io/helm-charts
      chart: k8s-monitoring
      targetRevision: 4.0.3
      helm:
        releaseName: grafana-k8s-monitoring
        valuesObject:
          cluster:
            name: homelab

          # Destinations are an object map keyed by name in v4. Local only —
          # we used to dual-ship to Grafana Cloud, but the cloud stack and
          # all dependent secrets/tokens have been retired.
          destinations:
            # No auth on the local destinations — both are cluster-internal
            # ClusterIP services in the same namespace as the collectors.
            local-metrics:
              type: prometheus
              url: http://victoria-metrics.monitoring.svc.cluster.local:8428/api/v1/write
              auth:
                type: none

            local-logs:
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
              auth:
                type: none

          # ---- Features: enabled ----
          clusterMetrics:
            enabled: true
            collector: alloy-metrics

          clusterEvents:
            enabled: true
            collector: alloy-singleton

          # Drop ingress-nginx (single biggest source on most clusters) and
          # kube-system (CNI / kube-proxy chatter) at the agent so they never
          # count against ingest.
          podLogsViaLoki:
            enabled: true
            collector: alloy-logs
            excludeNamespaces:
              - ingress-nginx
              - kube-system
            # Redact common credential shapes before logs reach Loki. The
            # *arr apps log full URLs including ?apikey=... (upstream bug,
            # tracked for years); Grafana SA tokens (glsa_...) sometimes
            # appear in error messages. Pattern: match query-param style
            # apikey=hex and arbitrary glsa_ tokens.
            extraLogProcessingStages: |-
              stage.replace {
                expression = "apikey=[a-fA-F0-9]{32}"
                replace    = "apikey=REDACTED"
              }
              stage.replace {
                expression = "glsa_[A-Za-z0-9_]{40,}"
                replace    = "glsa_REDACTED"
              }

          # Pick up any ServiceMonitor/PodMonitor/Probe CR in any namespace.
          # Apps express their own scrape config rather than us hand-rolling
          # Alloy stanzas per app. CRDs are already installed cluster-wide.
          prometheusOperatorObjects:
            enabled: true
            collector: alloy-metrics

          # Also scrape pods/services that opt in with the legacy
          # prometheus.io/scrape annotation set. Covers the arr-stack apps
          # that don't ship Prometheus Operator CRs.
          annotationAutodiscovery:
            enabled: true
            collector: alloy-metrics

          # OTLP receiver disabled — chart validation requires a traces
          # destination once enabled, and we have no local Tempo to receive
          # them after cutting Grafana Cloud. Re-enable + add a Tempo
          # destination if/when we instrument apps with OpenTelemetry.
          applicationObservability:
            enabled: false
          autoInstrumentation:
            enabled: false
          profiling:
            enabled: false
          profilesReceiver:
            enabled: false
          costMetrics:
            enabled: false
          # Host-level metrics from node-exporter (CPU/mem breakdown, disk
          # space + I/O, filesystem, network, load average). The cluster
          # previously had only kubelet/cAdvisor node_* metrics (cpu usage
          # + working-set mem) — no disk-fill or load visibility. Pairs with
          # telemetryServices.node-exporter.deploy below (deploy = run the
          # DaemonSet; hostMetrics = scrape it).
          hostMetrics:
            enabled: true
            collector: alloy-metrics
            # linuxHosts is the switch that actually wires Alloy to
            # discover + scrape the node-exporter DaemonSet. hostMetrics.enabled
            # alone only renders an empty feature stub; without this the
            # DaemonSet runs but nothing scrapes it (verified via helm template).
            linuxHosts:
              enabled: true
              # The chart's default allowlist is "the minimal set required
              # for Kubernetes Monitoring", which leaves out everything you
              # actually want when a machine disappears. node1 dropped off
              # the network twice in two days (2026-09-27 and 2026-09-28)
              # with no shutdown logged, and there was nothing recorded to
              # say whether it cooked, suspended, or lost power.
              #
              # node1 and node2 are identical AMD boxes. Their CPU sensor
              # is k10temp, exposed as hwmon chip pci0000:00_0000:00:18_3
              # label Tctl - verified against node2's live /metrics. The
              # node-exporter was already collecting all of this; the
              # allowlist was dropping it before it reached the database.
              metricsTuning:
                includeMetrics:
                  # Thermal. Tctl is the CPU die temp on these.
                  - node_hwmon_temp_celsius
                  - node_hwmon_temp_max_celsius
                  - node_hwmon_temp_crit_celsius
                  - node_hwmon_sensor_label
                  - node_thermal_zone_temp
                  # Throttling. If it is overheating it throttles before
                  # it dies, so these should climb ahead of a thermal
                  # shutdown and say so plainly.
                  - node_cpu_core_throttles_total
                  - node_cpu_package_throttles_total
                  - node_cpu_scaling_frequency_hertz
                  # Sleep / suspend / unclean reboot. A suspended machine
                  # looks exactly like a dead one from here: gone at layer
                  # 2, nothing in the logs. boot_time_seconds jumping means
                  # it rebooted; node_time_seconds advancing slower than
                  # wall clock means it was asleep.
                  - node_boot_time_seconds
                  - node_time_seconds
                  - node_context_switches_total
                  - node_intr_total
                  # Power supply / battery, in case this is a laptop-class
                  # board browning out rather than a thermal event.
                  - node_power_supply_online
                  - node_power_supply_present
                  # Memory exhaustion. node1 is 16 CPUs against 12Gi of
                  # RAM, so a runaway workload can plausibly wedge the box
                  # hard enough to stop answering ARP. An OOM kill leaves a
                  # counter behind even when nothing else survives.
                  - node_vmstat_oom_kill
                  - node_memory_MemTotal_bytes
                  - node_memory_MemFree_bytes
                  - node_memory_Cached_bytes
                  - node_memory_SwapFree_bytes
                  - node_memory_SwapTotal_bytes
                  # PSI. Stall pressure rises while a machine is dying in a
                  # way load average alone does not show.
                  - node_pressure_cpu_waiting_seconds_total
                  - node_pressure_memory_waiting_seconds_total
                  - node_pressure_io_waiting_seconds_total
                  - node_load1
                  - node_load5
                  - node_load15
                  # Disk and NIC health - the other two ways a node goes
                  # quiet without logging anything.
                  - node_disk_io_time_seconds_total
                  - node_disk_read_errors_total
                  - node_disk_write_errors_total
                  - node_network_up
                  - node_network_carrier_changes_total

          # ---- Collectors ----
          # alloy-metrics: single-replica deployment avoids the clustering
          # requirement that the chart enforces on daemonset/multi-replica
          # metrics collectors. Fine for a homelab.
          collectors:
            alloy-metrics:
              enabled: true
              controller:
                type: deployment
                replicas: 1
            alloy-singleton:
              enabled: true
            alloy-logs:
              enabled: true
              presets:
                - filesystem-log-reader
                - daemonset

          # kube-state-metrics is required by clusterMetrics; the chart
          # deploys it as a sub-chart here.
          telemetryServices:
            kube-state-metrics:
              deploy: true
            node-exporter:
              deploy: true
            windows-exporter:
              deploy: false
            kepler:
              deploy: false
            opencost:
              deploy: false
