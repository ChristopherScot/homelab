apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.29.1
    helm:
      releaseName: vault
      values: |
        server:
          # AWS creds for the awskms seal stanza. Populated by the k8s
          # Secret `vault-autounseal-aws` in the same namespace (created
          # out-of-band via `kubectl create secret` — NOT ESO, since ESO
          # depends on Vault being unsealed, which is what we're trying
          # to enable). Rotating the AK/SK is a manual op: update 1P
          # (homelab-vault-autounseal-aws), regenerate the Secret, roll
          # the pod. See vault/README.md if we ever add one.
          extraEnvironmentVars:
            VAULT_SEAL_TYPE: "awskms"
            VAULT_AWSKMS_SEAL_KEY_ID: "alias/homelab-vault-unseal"
            AWS_REGION: "us-east-1"
          extraSecretEnvironmentVars:
            - envName: AWS_ACCESS_KEY_ID
              secretName: vault-autounseal-aws
              secretKey: AWS_ACCESS_KEY_ID
            - envName: AWS_SECRET_ACCESS_KEY
              secretName: vault-autounseal-aws
              secretKey: AWS_SECRET_ACCESS_KEY
          standalone:
            enabled: true
            # Override the chart default HCL so we can add the seal
            # stanza. Keep everything else the chart shipped: file
            # storage, TCP listener, UI. The disable_seal_wrap =
            # "false" lets the KMS wrap the recovery key envelope.
            config: |
              ui = true

              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }

              storage "file" {
                path = "/vault/data"
              }

              # AWS KMS auto-unseal. Vault talks to KMS on every start
              # to unwrap the master key; the AWS creds come from
              # extraSecretEnvironmentVars above.
              seal "awskms" {
                region     = "us-east-1"
                kms_key_id = "alias/homelab-vault-unseal"
              }

              disable_mlock = true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Note: not using ServerSideApply here. SSA + ignoreDifferences with
  # managedFieldsManagers has known bugs in argocd <= 2.13 (see argo-cd
  # issues #20178, #11106, #9071). The jsonPointers form below works
  # reliably without SSA.
  ignoreDifferences:
    # k8s controller defaults injected on the live StatefulSet that aren't
    # in chart 0.29.1's rendered manifest.
    - group: apps
      kind: StatefulSet
      name: vault
      namespace: default
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/serviceAccount
    # Container-level defaults (terminationMessagePath/Policy, empty
    # resources{}, ordering differences in env/ports) and volume-mount
    # ordering differences. These are entirely live-state noise.
    - group: apps
      kind: StatefulSet
      name: vault
      namespace: default
      jqPathExpressions:
        - .spec.template.spec.containers[].terminationMessagePath
        - .spec.template.spec.containers[].terminationMessagePolicy
        - .spec.template.spec.containers[].resources
        - .spec.volumeClaimTemplates
    # vault-agent-injector self-rotates its webhook CA bundle. The chart
    # ships caBundle: "" and vault-k8s writes the real cert at startup.
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
