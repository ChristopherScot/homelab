apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: codex-pods
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ChristopherScot/homelab
    targetRevision: HEAD
    path: codex-pods
  destination:
    server: https://kubernetes.default.svc
    namespace: codex-pods
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
