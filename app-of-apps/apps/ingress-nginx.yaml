apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          ingressClassResource:
            default: false
            name: nginx
          ingressClass: nginx
          config:
            allow-snippet-annotations: "true"
            annotations-risk-level: Critical
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
            annotations:
              metallb.universe.tf/loadBalancerIPs: "192.168.50.225"
          admissionWebhooks:
            enabled: true
            patch:
              enabled: true
          watchIngressWithoutClass: false
          # Scrape the built-in Prometheus metrics endpoint (:10254/metrics
          # is exposed by the controller by default, no chart flag needed)
          # via Grafana Alloy's annotation auto-discovery. Powers the
          # ingress 5xx rate alert (grafana-alertrules-ingress.yaml).
          # Using portNumber (not portName) because the chart doesn't
          # declare :10254 as a named containerPort by default.
          podAnnotations:
            k8s.grafana.com/scrape: "true"
            k8s.grafana.com/metrics.path: "/metrics"
            k8s.grafana.com/metrics.portNumber: "10254"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # admission-create/patch pre-install jobs re-run every sync
      # otherwise and hang forever if the webhook Secret already exists.
      - SkipHookIfAlreadyPresent=true
