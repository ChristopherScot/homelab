# Applications for services homelabctl generates, from one template.
#
# Scoped deliberately to homelabctl-managed services rather than every app
# in this repo: the others are Helm charts or the arr-stack's multi-source
# apps, which this template cannot express and which gain nothing from it.
# Adding service number three should be "commit a directory", not "write
# another Application by hand".
#
# Each service publishes deploy/argocd.json from its own config.yaml, so
# the values here stay derived from the service's source of truth.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelabctl-services
  namespace: argocd
spec:
  # sync, not create-update.
  #
  # create-update was chosen so a generator that stopped listing a
  # service could not delete its Application. It turned out not to mean
  # that: it also declines to update fields on an Application that
  # already exists, so adding repoURL and path to argocd.json left both
  # live services pointing at a stale path, and no amount of reconciling
  # fixed it. A policy that silently ignores half a change is worse than
  # one that applies it.
  #
  # The cascade finalizer is still on, so this IS the policy that
  # decides whether a service can be deleted by removing its
  # argocd.json - and it can. That is intended: removing a service
  # should remove the service, not leave its workloads running with
  # nothing managing them.
  #
  # An earlier version of this comment claimed the finalizer was "off
  # the template", which was never true - the controller adds one
  # unless preserveResourcesOnDeletion says otherwise, and it does not.
  # Deleting a generated Application is therefore NOT a recoverable
  # repair; see the note on the template below.
  syncPolicy:
    applicationsSync: sync

    # preserveResourcesOnDeletion is deliberately NOT set, so the
    # cascade finalizer the controller adds by default stays.
    #
    # Deleting a generated Application should take its workloads with
    # it. Removing a service means removing the service: its Deployment,
    # Service and Ingress go too, rather than being left running with
    # nothing managing them. That is the whole point of the record being
    # generated from argocd.json - stop listing the service and it is
    # gone, cleanly.
    #
    # Worth being precise about what triggers that, because
    # applicationsSync is `sync` rather than the `create-update` an
    # older comment below still assumes: the ApplicationSet DOES delete
    # an Application when its */argocd.json stops appearing in this
    # repo. So deleting pokedex/argocd.json deletes the running pokedex.
    # That is intended, and it is the only thing that deletes one.
    #
    # It also reaches anything a service ships under manifests/ - a CNPG
    # Cluster and its PVCs included. Same decision as prune: true on the
    # generated apps, made knowingly, and backed by the S3 backups the
    # cloudnative-pg-clusters definitions configure.

  # Hands /spec/source/kustomize to argocd-image-updater and stops
  # reconciling it.
  #
  # applicationsSync: sync means the controller patches a generated
  # Application back to this template whenever the two differ. That is
  # what makes a changed repoURL or manifestPath actually apply - and it
  # also reverted every digest the image updater wrote, in under five
  # seconds, silently.
  #
  # The updater's write-back-method is argocd, so the digest it resolves
  # lands in spec.source.kustomize.images on the live Application rather
  # than in git. With that field reconciled, the updater logged
  # "Successfully updated the live application spec" every five minutes
  # while the running Deployment sat on a bare :latest tag that
  # Kubernetes had no reason to re-pull. Nothing auto-deployed, and
  # nothing reported an error.
  #
  # Scoped to the one field the updater owns: everything else in the
  # template still reconciles.
  #
  # The accepted cost is that the digest lives only in the cluster. It is
  # not in git, so it is not reviewable, and a cluster rebuilt from
  # bootstrap comes back on whatever :latest resolves to at that moment
  # rather than the digest each app was pinned at. Almost always the same
  # image; not guaranteed to be.
  #
  # The alternative that puts it in git is CI committing its own digest
  # into deploy/<name>/kustomization.yaml, which needs no credential the
  # service's workflow does not already have. That is the upgrade path if
  # digest-in-git is ever wanted; it is not a change to this file.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/kustomize
  generators:
    - git:
        repoURL: 'https://github.com/ChristopherScot/homelab'
        revision: HEAD
        files:
          - path: '*/argocd.json'
  template:
    metadata:
      name: '{{name}}'
      labels:
        team: '{{team}}'
      annotations:
        # Track :latest by DIGEST, not by tag string. Kubernetes only
        # re-pulls when the tag text changes, so a bare :latest would
        # never roll on its own.
        argocd-image-updater.argoproj.io/image-list: '{{name}}={{image}}:latest'
        argocd-image-updater.argoproj.io/{{name}}.update-strategy: digest
        # write-back-method: argocd, not git. The updater stores the
        # resolved digest on the Application in the cluster rather than
        # committing it to the repo.
        #
        # That is what lets an Application read its manifests from the
        # SERVICE's own repo. Git write-back has to commit into whichever
        # repo holds kustomization.yaml, so pointing Argo at a service
        # repo meant giving the updater write access to every service
        # repo - a credential this does not need in order to do its job.
        #
        # The cost is that the digest lives only in the cluster: after a
        # rebuild, apps come back on whatever :latest resolves to rather
        # than the digest they were pinned at. That is almost always the
        # same image, and it is a smaller price than a write credential
        # on every repo.
        #
        # If digest-in-git is ever wanted back, the upgrade is a service
        # committing its own digest from CI - which already has write
        # access to its own repo via GITHUB_TOKEN - not widening this.
        argocd-image-updater.argoproj.io/write-back-method: argocd
      # The resources-finalizer is not set here and does not need to be:
      # the ApplicationSet controller adds one to every Application it
      # generates unless preserveResourcesOnDeletion says otherwise, and
      # the syncPolicy above deliberately leaves it unset.
      #
      # So "delete the record, let the generator rebuild it" is NOT a
      # safe repair here - it takes the running service with it. To
      # rebuild an Application without touching its workloads, remove
      # the finalizer from that one Application by hand first.
    spec:
      project: default
      # Read from the SERVICE's own repo, not from here. A service's
      # manifests are rendered by homelabctl into its own deploy/
      # directory and committed there; copying them into this repo was
      # the one manual step left in the chain, and the step people
      # forget.
      #
      # Both fields come from the service's argocd.json, so a service in
      # a monorepo and one in its own repo are described the same way.
      source:
        repoURL: '{{repoURL}}'
        targetRevision: HEAD
        # manifestPath, not path: the git file generator supplies its
        # own {{path}} - the directory of the matched argocd.json - and
        # it wins over a key of the same name in the file.
        path: '{{manifestPath}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
