# Applications for services homelabctl generates, from one template.
#
# Scoped deliberately to homelabctl-managed services rather than every app
# in this repo: the others are Helm charts or the arr-stack's multi-source
# apps, which this template cannot express and which gain nothing from it.
# Adding service number three should be "commit a directory", not "write
# another Application by hand".
#
# Each service publishes deploy/argocd.json from its own config.yaml, so
# the values here stay derived from the service's source of truth.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelabctl-services
  namespace: argocd
spec:
  # sync, not create-update.
  #
  # create-update was chosen so a generator that stopped listing a
  # service could not delete its Application. It turned out not to mean
  # that: it also declines to update fields on an Application that
  # already exists, so adding repoURL and path to argocd.json left both
  # live services pointing at a stale path, and no amount of reconciling
  # fixed it. A policy that silently ignores half a change is worse than
  # one that applies it.
  #
  # What made create-update's protection matter was the cascade
  # finalizer, which is now off the template: deleting a generated
  # Application removes the record and leaves the running workload
  # alone, so the generator can rebuild it. The delete is recoverable,
  # and the stale spec was not.
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: 'https://github.com/ChristopherScot/homelab'
        revision: HEAD
        files:
          - path: '*/argocd.json'
  template:
    metadata:
      name: '{{name}}'
      labels:
        team: '{{team}}'
      annotations:
        # Track :latest by DIGEST, not by tag string. Kubernetes only
        # re-pulls when the tag text changes, so a bare :latest would
        # never roll on its own.
        argocd-image-updater.argoproj.io/image-list: '{{name}}={{image}}:latest'
        argocd-image-updater.argoproj.io/{{name}}.update-strategy: digest
        # write-back-method: argocd, not git. The updater stores the
        # resolved digest on the Application in the cluster rather than
        # committing it to the repo.
        #
        # That is what lets an Application read its manifests from the
        # SERVICE's own repo. Git write-back has to commit into whichever
        # repo holds kustomization.yaml, so pointing Argo at a service
        # repo meant giving the updater write access to every service
        # repo - a credential this does not need in order to do its job.
        #
        # The cost is that the digest lives only in the cluster: after a
        # rebuild, apps come back on whatever :latest resolves to rather
        # than the digest they were pinned at. That is almost always the
        # same image, and it is a smaller price than a write credential
        # on every repo.
        #
        # If digest-in-git is ever wanted back, the upgrade is a service
        # committing its own digest from CI - which already has write
        # access to its own repo via GITHUB_TOKEN - not widening this.
        argocd-image-updater.argoproj.io/write-back-method: argocd
      # No resources-finalizer, unlike a hand-written Application.
      #
      # That finalizer means "deleting this Application deletes what it
      # manages", which is right for one someone wrote and wrong for one
      # a generator owns: applicationsSync is create-update, so the
      # ApplicationSet never deletes these. The only thing the finalizer
      # can do here is turn an ordinary repair - delete the record, let
      # the generator rebuild it - into a cascade that takes the running
      # service with it.
    spec:
      project: default
      # Read from the SERVICE's own repo, not from here. A service's
      # manifests are rendered by homelabctl into its own deploy/
      # directory and committed there; copying them into this repo was
      # the one manual step left in the chain, and the step people
      # forget.
      #
      # Both fields come from the service's argocd.json, so a service in
      # a monorepo and one in its own repo are described the same way.
      source:
        repoURL: '{{repoURL}}'
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
