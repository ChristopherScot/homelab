name: bootstrap memory tests

on:
  pull_request:
    paths:
      - 'bootstrap/k3s-*'
      - 'bootstrap/tests/**'
      - '.github/workflows/bootstrap-memory-tests.yml'
  push:
    branches: [main]
    paths:
      - 'bootstrap/k3s-*'
      - 'bootstrap/tests/**'
      - '.github/workflows/bootstrap-memory-tests.yml'

permissions:
  contents: read

jobs:
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s bootstrap/tests -v
      - run: bash -n bootstrap/k3s-config.sh
