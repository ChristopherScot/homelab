name: desloppify-pod tests

# The tool policy is what keeps the pod off main: it refuses pushes to a
# protected branch, PRs based on anything but the integration branch, and
# `gh pr merge`. A regression there is silent - the pod keeps working and
# the boundary is simply gone - so the cases run on every change rather
# than only on the laptop of whoever last edited them.
on:
  pull_request:
    paths:
      - 'desloppify-pod/**'
      - 'app-of-apps/apps/desloppify-pod.yaml'
      - '.github/workflows/desloppify-tests.yml'
  push:
    branches: [main]
    paths:
      - 'desloppify-pod/**'
      - 'app-of-apps/apps/desloppify-pod.yaml'
      - '.github/workflows/desloppify-tests.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Tool policy
        working-directory: desloppify-pod
        run: python3 test_policy.py

      - name: Run timeout
        working-directory: desloppify-pod
        run: python3 test_timeout.py

      - name: PR verification epilogue
        working-directory: desloppify-pod
        run: python3 test_report.py

      - name: Workspace mount check
        run: desloppify-pod/test-mount-check.sh

      - name: Log redirection
        run: desloppify-pod/test-log-redirect.sh

      - name: Runner PATH
        run: desloppify-pod/test-path.sh

      - name: CronJob manifest
        run: desloppify-pod/test-cronjob.sh

      # Skips without a checkout of the app repo, which CI does not
      # have; it is here so a local run before changing the sidecars
      # catches drift against the compose file.
      - name: Test sidecars
        run: desloppify-pod/test-sidecars.sh

      - name: Credential scope
        run: desloppify-pod/test-secret-scope.sh

      - name: Account failover
        run: claude-pods/tests/test-account-failover.sh

      # Shared with claude-pods: the two images follow one digest-pinning
      # story and the check covers both directories. It is wired here too
      # because a change under desloppify-pod/ does not run the
      # claude-pods workflow.
      - name: Image pinning
        run: claude-pods/tests/image-pinning.sh

      # Feeding the hook stdin by hand tests its parsing but not its
      # wiring, and a hook git never invokes passes that test. This one
      # pushes for real against a local remote and asserts main did not
      # move.
      - name: pre-push hook
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          desloppify-pod/git-hooks/test-pre-push.sh

      - name: Shell syntax
        run: |
          set -e
          for s in desloppify-pod/*.sh desloppify-pod/git-hooks/pre-push; do
            echo "== $s"
            bash -n "$s"
          done
