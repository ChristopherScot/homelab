name: claude-pods tests

# The stage scripts run unattended; a bug in a rarely-taken path (like
# the post-merge revert in #60) can sit for weeks before a real run hits
# it. Their tests live in claude-pods/tests/ and run here on every change
# so they do not depend on someone remembering to.
on:
  pull_request:
    paths:
      - 'claude-pods/**'
      - 'bootstrap/vault-policies.sh'
      # tests/image-pinning.sh also checks the root app and the
      # Applications it enrols. Every app file rather than a list that
      # mirrors the test's: the suite takes seconds, and a list here
      # was one more place to forget when the test gained an entry.
      - 'app-of-apps/app-of-apps.yaml'
      - 'app-of-apps/apps/*.yaml'
      - '.github/workflows/claude-pods-tests.yml'
  push:
    branches: [main]
    paths:
      - 'claude-pods/**'
      - 'bootstrap/vault-policies.sh'
      - 'app-of-apps/app-of-apps.yaml'
      - 'app-of-apps/apps/*.yaml'
      - '.github/workflows/claude-pods-tests.yml'
  # To run the suite on a branch before its PR exists:
  #   gh workflow run claude-pods-tests.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run claude-pods/tests
        run: |
          set -e
          for t in claude-pods/tests/*.sh; do
            echo "== $t"
            bash "$t"
          done
