name: claude-pod image

on:
  push:
    branches: [main]
    paths:
      # Only what actually lands in the image. claude-pods/ also holds
      # the k8s manifests and the test suite, and neither is COPYd --
      # so editing kaneo-dispatcher.yaml used to rebuild a container
      # that does not contain it, mint a new digest, and force Argo to
      # redeploy the very thing the manifest describes. A 1.6GB pull,
      # during which nothing advances the Kaneo board, because the
      # dispatcher is now the only trigger (the cronjobs went in #160).
      # 2026-11-11 saw three such rebuilds in 45 minutes, all from
      # comment and rename changes.
      - 'claude-pods/**'
      - '!claude-pods/**.yaml'
      - '!claude-pods/tests/**'
      - '!claude-pods/README.md'
      - '.github/workflows/claude-pod-image.yml'
  workflow_dispatch:

concurrency:
  group: claude-pod-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/christopherscot/claude-pod
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: claude-pods
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
