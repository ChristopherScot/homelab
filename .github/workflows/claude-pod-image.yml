name: claude-pod image

on:
  push:
    branches: [main]
    # Only what the Dockerfile actually COPYs (plus itself). The old
    # 'claude-pods/**' rebuilt on manifest and test changes too; builds
    # are not byte-reproducible, so every no-op rebuild minted a new
    # digest and argocd-image-updater rolled the whole fleet for
    # nothing. Adding a COPY to the Dockerfile? Add its source here,
    # like codex-pod-image.yml does.
    paths:
      - 'claude-pods/Dockerfile'
      - 'claude-pods/*.sh'
      - 'claude-pods/*.lua'
      - 'claude-pods/tmux.conf'
      - 'claude-pods/dispatcher/**'
      - 'claude-pods/lib/**'
      - 'claude-pods/prompts/**'
      - 'claude-pods/skills/**'
      - '.github/workflows/claude-pod-image.yml'
  workflow_dispatch:

concurrency:
  group: claude-pod-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/christopherscot/claude-pod
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: claude-pods
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
