name: codex-pod image

on:
  push:
    branches: [main]
    paths:
      - 'codex-pods/Dockerfile'
      - 'codex-pods/tests/image-smoke.sh'
      - '.github/workflows/codex-pod-image.yml'
  workflow_dispatch:

concurrency:
  group: codex-pod-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/christopherscot/codex-pod
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      # Load and test the exact image before publishing it.
      - uses: docker/build-push-action@v6
        with:
          context: codex-pods
          platforms: linux/amd64
          load: true
          tags: codex-pod:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Cold start without network or persistent caches
        run: |
          docker run --rm --network=none --read-only \
            --tmpfs /tmp --tmpfs /home/node:uid=1000,gid=1000 \
            --tmpfs /workspace:uid=1000,gid=1000 \
            codex-pod:smoke bash /usr/local/share/codex-pods/image-smoke.sh
      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag codex-pod:smoke "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
