name: desloppify-pod image

on:
  push:
    branches: [main]
    paths:
      # Same scoping as claude-pod-image: desloppify-pod/ also holds the
      # k8s manifests and the test scripts, and the Dockerfile COPYs
      # neither, so editing one used to rebuild the image for nothing.
      - 'desloppify-pod/**'
      - '!desloppify-pod/**.yaml'
      - '!desloppify-pod/test-*.sh'
      - '!desloppify-pod/README.md'
      - '.github/workflows/desloppify-image.yml'
  workflow_dispatch:

concurrency:
  group: desloppify-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/christopherscot/desloppify-pod
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desloppify-pod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
