name: desloppify-pod image

on:
  push:
    branches: [main]
    # Only what the Dockerfile actually COPYs (plus itself) - see the
    # note in claude-pod-image.yml for why '**' minted no-op digests.
    # claude-pods/lib/claude-account.sh is a cross-directory COPY.
    paths:
      - 'desloppify-pod/Dockerfile'
      - 'desloppify-pod/*.sh'
      - 'desloppify-pod/*.py'
      - 'desloppify-pod/git-hooks/**'
      - 'claude-pods/lib/claude-account.sh'
      - '.github/workflows/desloppify-image.yml'
  workflow_dispatch:

concurrency:
  group: desloppify-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/christopherscot/desloppify-pod
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desloppify-pod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
