name: claude-task image

# The task-worker image, separate from claude-pod (the interactive session
# image) so building or merging it never rolls the session StatefulSet or
# the CronJobs that run on claude-pod. Only the claude-task Application
# consumes this image.
on:
  push:
    branches: [main]
    # Only what claude-pods/task/Dockerfile actually COPYs (plus itself).
    # Adding a COPY to that Dockerfile? Add its source here.
    paths:
      - 'claude-pods/task/**'
      - 'claude-pods/stage-*.sh'
      - 'claude-pods/lib/maintenance.sh'
      - 'claude-pods/prompts/**'
      - 'claude-pods/skills/**'
      - 'claude-pods/kbrowser.sh'
      - '.github/workflows/claude-task-image.yml'
  workflow_dispatch:

concurrency:
  group: claude-task-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/christopherscot/claude-task
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Load and test the exact image before publishing it, the way
      # codex-pod-image.yml does.
      - uses: docker/build-push-action@v6
        with:
          context: claude-pods
          file: claude-pods/task/Dockerfile
          platforms: linux/amd64
          load: true
          tags: claude-task:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No network, read-only root, empty home and workspace: the worker,
      # its entrypoints and every tool it or the agent may call must be
      # present and runnable from the image alone, and nothing interactive
      # may have crept back in.
      - name: Smoke-test worker entrypoints and tools offline
        run: |
          docker run --rm --network=none --read-only \
            --tmpfs /tmp --tmpfs /home/node:uid=1000,gid=1000 \
            --tmpfs /workspace:uid=1000,gid=1000 \
            -v "$PWD/claude-pods/task/image-smoke.sh:/image-smoke.sh:ro" \
            claude-task:smoke bash /image-smoke.sh

      - name: Record image size
        run: |
          size=$(docker image inspect --format '{{.Size}}' claude-task:smoke)
          echo "claude-task uncompressed size: $size bytes ($((size / 1024 / 1024)) MiB)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag claude-task:smoke "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
