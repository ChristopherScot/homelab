# The identity the garage pods run as, and the one thing it may do:
# publish and read GarageNode objects in its own namespace for peer
# discovery ([kubernetes_discovery] in configmap.yaml).
#
# Namespaced Role, not a ClusterRole: the upstream chart grants
# cluster-wide rights so garage can create the CRD itself. Here the CRD
# is committed (crd.yaml) and skip_crd is set, so the pod needs nothing
# outside this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-node
  namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-node
  namespace: garage
rules:
  - apiGroups: ["deuxfleurs.fr"]
    resources: ["garagenodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-node
  namespace: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-node
subjects:
  - kind: ServiceAccount
    name: garage-node
    namespace: garage
