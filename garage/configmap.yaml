# garage.toml. Nothing secret here - the RPC secret arrives as
# GARAGE_RPC_SECRET from the Vault-backed secret, and env overrides the
# file, so this stays a plain ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"

    # sqlite rather than the lmdb default: lmdb preallocates a large
    # sparse map file, which reads as alarming disk use on a 2Gi volume
    # holding a few hundred objects. sqlite is the documented
    # alternative and is sized to what is stored.
    db_engine = "sqlite"

    # One node, one copy. See the statefulset comment for why this is
    # the right trade for re-seedable reference material.
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    # Requests naming any other region are rejected, so clients must be
    # configured with exactly this value.
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
