# Vault-backed secrets for Garage, same shape as every other app here:
# a namespace-scoped SecretStore authenticating with a Kubernetes role,
# and ExternalSecrets that project kv paths into real Secrets.
#
# HANDOFF: garage-rpc currently exists as a hand-created Secret so the
# pod could start before Vault was seeded. It has none of External
# Secrets' ownership markers (reconcile.external-secrets.io/managed),
# and these ExternalSecrets default to creationPolicy: Owner, which
# refuses to adopt a Secret it did not create. Seeding Vault without
# deleting the hand-made one leaves the ExternalSecret stuck in
# SecretSyncError while garage keeps running on the stale value -- a
# failure that pages nobody and is invisible until the next rotation.
#
# So when seeding:  kubectl delete secret garage-rpc -n garage
# then let ESO create it. The pod restarts on the new value via the
# reloader annotation, which is safe on a single node.
#
# Seed the Vault side once (the values are generated, not chosen):
#   vault kv put kv/garage/rpc rpc-secret="$(openssl rand -hex 32)"
#   vault kv put kv/garage/s3-reference \
#     access-key-id=<claude-worker, the READ-ONLY key> \
#     secret-access-key=<same>
#
# The S3 key cannot be generated ahead of time: Garage mints it, so that
# path is filled after the first bootstrap. bootstrap/garage-init.sh
# prints the values to paste.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: garage
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-garage
  namespace: garage
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: garage
          serviceAccountRef:
            name: external-secrets-sa
---
# Cluster RPC secret. Single node today, so this only authenticates
# garage to itself - but it is mandatory, and a generated 32-byte hex
# value does not belong in a ConfigMap.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: garage-rpc
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-garage
    kind: SecretStore
  target:
    name: garage-rpc
    template:
      type: Opaque
      data:
        rpc-secret: "{{ .rpc_secret }}"
  data:
    - secretKey: rpc_secret
      remoteRef: { key: garage/rpc, property: rpc-secret }
---
# The S3 key workers use to read reference material. Garage mints this
# (bootstrap/garage-init.sh prints it), so unlike the RPC secret it
# cannot be generated ahead of time - seed kv/garage/s3-reference after
# the first init run.
#
# Until then this ExternalSecret stays SecretSyncError - but do not read
# that as "just needs seeding". It currently fails with a 403, not a
# 404: it authenticates through the claude-pods Vault role, which has no
# read on kv/garage/s3-reference. Seeding the path alone changes
# nothing; the policy has to be widened too, and that role is not
# managed by bootstrap/vault-policies.sh.
#
# Lives in claude-pods, where the workers are, and reuses that
# namespace's existing vault-claude-pods SecretStore rather than
# declaring another: the ServiceAccount and SecretStore there are owned
# by the claude-pods Application, and a second copy here would make two
# Argo apps fight over the same objects.
#
# That store authenticates as the claude-pods Vault role, so that
# policy - not the garage one - needs read on kv/garage/s3-reference.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: garage-s3-reference
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-claude-pods
    kind: SecretStore
  target:
    name: garage-s3-reference
    template:
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        # Clients must name exactly this region; garage.toml sets it and
        # rejects anything else.
        AWS_DEFAULT_REGION: "garage"
        AWS_ENDPOINT_URL: "http://garage.garage.svc.cluster.local:3900"
  data:
    - secretKey: access_key_id
      remoteRef: { key: garage/s3-reference, property: access-key-id }
    - secretKey: secret_access_key
      remoteRef: { key: garage/s3-reference, property: secret-access-key }
---
# The read-write key, for seeding only. Deliberately separate from
# garage-s3-reference: workers get read, and nothing that runs
# unattended should hold a credential that can overwrite the books
# every other worker boots from.
#
# seed-reference-job.yaml consumes this. It referenced the name before
# anything defined it, which is worse than it sounds - envFrom on a
# missing secret leaves the pod in CreateContainerConfigError with the
# Job reporting no error at all, so `kubectl logs -f` just hangs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: garage-s3-seed
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-claude-pods
    kind: SecretStore
  target:
    name: garage-s3-seed
    template:
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        AWS_DEFAULT_REGION: "garage"
        AWS_ENDPOINT_URL: "http://garage.garage.svc.cluster.local:3900"
  data:
    - secretKey: access_key_id
      remoteRef: { key: garage/s3-seed, property: access-key-id }
    - secretKey: secret_access_key
      remoteRef: { key: garage/s3-seed, property: secret-access-key }
