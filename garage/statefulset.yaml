# Garage: S3-compatible object storage, in-cluster.
#
# Here to serve reference material (books, skills, plugins) to the
# claude worker pods without a shared filesystem, and to be the place
# anything else that wants a bucket goes. A read-only RWX mount would
# also work for the first job, but object storage gives stronger
# isolation for free: there is no filesystem for one worker to see
# another through, only HTTP against a bucket. It also leaves nothing
# attached between tasks, so workers really do scale to zero.
#
# MinIO was tried here before and never worked; its Services are still
# orphaned in the minio namespace with no endpoints. Garage is a single
# small daemon by comparison - one binary, SQLite metadata, no operator.
#
# Three nodes, one per k8s node, replication_factor 3. The first cut was
# one node with no redundancy, which was fine for re-seedable books and
# wrong for a store meant to hold more than that. Losing any one node
# now leaves the other two serving reads AND writes; the pod on the lost
# node simply waits for it to return. Where the redundancy lives is the
# decision worth understanding, and storageclass.yaml spells it out:
# Garage replicates across nodes, so each node's volumes are
# single-replica and pinned to that node, rather than paying Longhorn to
# replicate the replicas.
#
# Named garage-node, not garage. volumeClaimTemplates are immutable, so
# the move from one storage class to another could not be an edit of
# the old StatefulSet - Argo would have sat at SyncFailed on the
# Forbidden. A new name lets Argo prune the old object and create this
# one in a single sync. The S3 Service keeps the name garage, which is
# the only name clients know.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage-node
  namespace: garage
spec:
  serviceName: garage-node
  replicas: 3
  # Parallel because Ready means "healthy with quorum", and no pod can
  # have quorum until the others exist. OrderedReady would wait forever
  # on garage-node-0.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: garage-node
  template:
    metadata:
      labels:
        app: garage-node
      annotations:
        # Restart when the rpc secret rotates.
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: garage-node
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      # One pod per k8s node, as a hard rule. This is what gives "a node
      # going out" its meaning - three pods on one node would be three
      # copies behind one power cable. Longhorn adds PV node affinity
      # after attachment to keep later restarts on the same host.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: garage-node
      containers:
        - name: garage
          # v2.5.0, not a commit tag: the floating tags on this repo are
          # per-commit builds. >= 2.0 also makes [admin] admin_token
          # optional, which is why none is set below.
          image: dxflrs/garage:v2.5.0
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          env:
            # The secret comes from Vault via ExternalSecret rather than
            # the config file, so garage.toml can stay a plain ConfigMap
            # with nothing sensitive in it. Env overrides the file value.
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-rpc
                  key: rpc-secret
          volumeMounts:
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          # Ready is Garage's own /health: 200 only when this node has a
          # layout and can reach a quorum of its peers. That is exactly
          # the set of pods the S3 Service should send traffic to - a node
          # cut off from the other two cannot complete a write and should
          # not be asked to. A fresh cluster is therefore not Ready until
          # the layout is applied (bootstrap/garage-init.sh); that script
          # uses exec, which does not wait on readiness, so there is no
          # lockout.
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 10
            failureThreshold: 3
          # Liveness is only "is the process answering": losing quorum is
          # not fixed by restarting the one node that still has power.
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    # Both volumes on longhorn-garage: single replica, pinned to this
    # pod's node. The redundancy is the other two pods.
    #
    # Metadata: SQLite, small, latency-sensitive. Also holds this node's
    # identity (its key pair), so losing it makes the node a stranger to
    # the cluster - see garage/README.md for the re-admit step.
    - metadata:
        name: meta
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-garage
        resources:
          requests:
            storage: 3Gi
    # Object data. 30Gi per node is 30Gi usable (every node holds every
    # object). Sized to the node that has the least headroom: Longhorn
    # schedules against the full requested size and node2's SSD had 47Gi
    # left to schedule when this was written.
    # bootstrap/garage-init.sh reads this size off the PVC when it first
    # assigns a node, so it is declared once. To grow a running cluster
    # see garage/README.md: expand the PVCs, then a new layout version.
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-garage
        resources:
          requests:
            storage: 30Gi
---
# Voluntary disruptions - a drain, a Longhorn upgrade - may take one node
# at a time. Two would be below quorum.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: garage-node
  namespace: garage
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: garage-node
