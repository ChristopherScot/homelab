apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaneo-dispatcher
  namespace: claude-pods
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-kaneo-dispatcher
  namespace: claude-pods
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kaneo-dispatcher
          serviceAccountRef:
            name: kaneo-dispatcher
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kaneo-dispatcher-secrets
  namespace: claude-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kaneo-dispatcher
    kind: SecretStore
  target:
    name: kaneo-dispatcher-secrets
  data:
    - secretKey: KANEO_WEBHOOK_SECRET
      remoteRef: { key: claude-pods/kaneo, property: webhook-secret }
    - secretKey: KANEO_API_KEY
      remoteRef: { key: claude-pods/kaneo, property: api-key }
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: claude-pods/git, property: token }
    - secretKey: REPOS_POD0
      remoteRef: { key: claude-pods/repos, property: pod0 }
    - secretKey: REPOS_POD1
      remoteRef: { key: claude-pods/repos, property: pod1 }
    - secretKey: REPOS_POD2
      remoteRef: { key: claude-pods/repos, property: pod2 }
