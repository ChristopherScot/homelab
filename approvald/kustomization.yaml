# Required: argocd-image-updater writes the image digest into the
# `images:` block below. Without this file the app renders as a plain
# Directory and image automation silently skips it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - ingress.yaml
images:
  - name: ghcr.io/christopherscot/approvald
    digest: sha256:7c290e452324519f3ba87b387a53320a42c0b3a7d5c33714b59cd0c7ab581530
