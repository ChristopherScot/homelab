# Required: argocd-image-updater writes the image digest into the
# `images:` block below. Without this file the app renders as a plain
# Directory and image automation silently skips it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - ingress.yaml
images:
  - name: ghcr.io/christopherscot/approvald
    digest: sha256:f8703c0d1646f2f1b183358fcc558ba17de4a720d1d23b16d1c862bcc52fe0fa
