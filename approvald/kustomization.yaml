# Required: argocd-image-updater writes the image digest into the
# `images:` block below. Without this file the app renders as a plain
# Directory and image automation silently skips it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - ingress.yaml
images:
  - name: ghcr.io/christopherscot/approvald
    digest: sha256:48a0ded61f4348b7eb5ac9463ff5304b9ebf71c3ed800862a0e8b0f33bc32c01
