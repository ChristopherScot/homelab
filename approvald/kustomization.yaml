# Required: argocd-image-updater writes the image digest into the
# `images:` block below. Without this file the app renders as a plain
# Directory and image automation silently skips it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - ingress.yaml
images:
  - name: ghcr.io/christopherscot/approvald
    digest: sha256:b0446b2713f3af9f4e66cf853fdcb3d8319d069e884ad7c345d78a04eda81a15
