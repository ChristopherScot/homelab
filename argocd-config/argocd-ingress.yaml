apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=argocd-server"
    gethomepage.dev/href: "https://argo.home.chrisscotmartin.com"
    gethomepage.dev/name: "ArgoCD"
    gethomepage.dev/description: "GitOps controller"
    gethomepage.dev/group: "Cluster"
    gethomepage.dev/icon: "argo-cd.png"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: external
  tls:
    - hosts:
        - argo.home.chrisscotmartin.com
      secretName: argocd-tls
  rules:
    - host: argo.home.chrisscotmartin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
---
# argo.lab on its own resource, because ssl-redirect is a RESOURCE-scoped
# annotation rather than a per-host one. No public CA will issue for an
# undelegated name, so it has no certificate and must not be redirected
# to https - and while these rules shared an Ingress with the FQDN there
# was no correct setting: without the override argo.lab 308s to the
# controller's self-signed fallback, and with it the FQDN silently stops
# being redirected too.
#
# Deliberately no cluster-issuer annotation: that is what keeps
# cert-manager from ever attempting an order it cannot complete.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress-lan
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: external
  rules:
    - host: argo.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
