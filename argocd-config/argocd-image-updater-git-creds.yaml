# Git credentials for argocd-image-updater to write image bumps back to
# github.com/ChristopherScot/homelab. Token stored in Vault at
# kv/argocd/image-updater-github (fine-grained PAT with repo:write on
# ChristopherScot/homelab only). Argo CD's own repo credential template
# is looked up by URL prefix, so the same secret would also authenticate
# other push operations if we ever wanted them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-git
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-argocd
    kind: SecretStore
  target:
    name: argocd-image-updater-git
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Argo CD picks this up as a repo-write credential template
          # matching by URL prefix; image-updater uses it for git push.
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: "git"
        url: "https://github.com/ChristopherScot/homelab"
        # image-updater expects `username` + `password` for HTTPS token
        # auth; Argo CD uses the same fields as a repo-creds template.
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: argocd/image-updater-github
        property: username
    - secretKey: token
      remoteRef:
        key: argocd/image-updater-github
        property: token
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-argocd
  namespace: argocd
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: argocd
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: argocd
