apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  labels:
    app: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
      - name: pihole
        image: pihole/pihole:latest
        env:
        - name: WEBPASSWORD
          value: "changeme"
        - name: DNS1
          value: "8.8.8.8"
        - name: DNS2
          value: "8.8.4.4"
        ports:
        - containerPort: 80
        - containerPort: 53
        volumeMounts:
        - name: pihole-storage
          mountPath: /etc/pihole
      volumes:
      - name: pihole-storage
        persistentVolumeClaim:
          claimName: pihole-pvc-nfs
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pihole-nfs-pv
spec:
  mountOptions:
  # vers=4.1, not 3. The NAS refuses v3 for this export -- a v3 mount gets
  # "Connection refused" while 4.1 mounts the same path fine. Under `hard`
  # a refused mount retries forever instead of erroring, so pihole-FTL ends
  # up in uninterruptible sleep holding /etc/pihole, stops answering on :53,
  # and the pod still reports 1/1 Running because the readiness probe only
  # checks the web port. That is the 2026-11-09 DNS outage.
  - vers=4.1
  - hard
  - intr
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  nfs:
    server: 192.168.50.220
    path: /volume1/k8s-pv/pihole
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-pvc-nfs
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: pihole-nfs-pv
