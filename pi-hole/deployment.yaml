apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  labels:
    app: pihole
spec:
  replicas: 1
  # The config volume is RWO, so a new pod cannot attach it while the old
  # one still holds it. RollingUpdate would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
      - name: pihole
        image: pihole/pihole:latest
        env:
        - name: WEBPASSWORD
          value: "changeme"
        - name: DNS1
          value: "8.8.8.8"
        - name: DNS2
          value: "8.8.4.4"
        ports:
        - containerPort: 80
        - containerPort: 53
        volumeMounts:
        - name: pihole-storage
          mountPath: /etc/pihole
      volumes:
      - name: pihole-storage
        persistentVolumeClaim:
          claimName: pihole-config
---
# /etc/pihole on Longhorn, not NFS. pihole-FTL keeps SQLite databases here
# and SQLite needs real POSIX locks, which NFS does not provide -- FTL blocked
# in uninterruptible sleep on gravity.db and stopped answering :53 while the
# readiness probe kept reporting the pod healthy.
#
# Data was copied from 192.168.50.220:/volume1/k8s-pv/pihole, which is left
# in place as a fallback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-config
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
