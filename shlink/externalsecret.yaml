# Pulls the Shlink initial API key from Vault (kv/shlink, field api-key)
# into a k8s secret the deployment mounts as INITIAL_API_KEY.
#
# Per-app SecretStore and Vault role, the convention homelabctl generates
# for every service it manages: one role, one path, one namespace, bound
# to a named ServiceAccount.
#
# This replaced the cluster-wide `vault-backend` ClusterSecretStore, whose
# `demo` role bound service_account_names ['*'] across namespaces ['*']
# with read on kv/data/* - so any pod in the cluster could mint a token
# that read every secret in Vault, defeating the per-app isolation every
# other app here relies on. shlink was its only consumer.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shlink
  namespace: shlink
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-shlink
  namespace: shlink
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: shlink
          serviceAccountRef:
            name: shlink
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shlink-api
  namespace: shlink
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-shlink
    kind: SecretStore
  target:
    name: shlink-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: shlink
        property: api-key
