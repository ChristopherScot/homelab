# Kustomize overlay so argocd-image-updater has a canonical spot to
# write image bumps for the redirector. Everything shlink+redirector
# already deploys stays declared in the individual manifests; this
# file just: (a) enumerates them for Argo/kustomize, and (b) declares
# an `images:` list that image-updater rewrites when a new digest of
# ghcr.io/christopherscot/go-shlink-redirector:latest is published.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - web-client.yaml
  - redirector.yaml
  - ingress.yaml
  - externalsecret.yaml
images:
  - name: ghcr.io/christopherscot/go-shlink-redirector
    newTag: latest
