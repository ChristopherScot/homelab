# Shlink itself: the server, its web client and their secret. The
# redirector moved to its own Argo Application (shlink-redirector/),
# generated by homelabctl, and took its ingresses with it - both `go`
# and go.home.chrisscotmartin.com point at the redirector, not at
# shlink. Its image bumps are written to that app's kustomization now,
# which is why no `images:` block remains here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - web-client.yaml
  - externalsecret.yaml
