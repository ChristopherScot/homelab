# Required: argocd-image-updater writes the image digest into the
# `images:` block below. Without this file the app renders as a plain
# Directory and image automation silently skips it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - ingress.yaml
images:
  - name: ghcr.io/christopherscot/go-shlink-redirector
    digest: sha256:c674ad37f1d62d211851d66b276014d61103eab394e8fc761a036871ee5bd1c8
