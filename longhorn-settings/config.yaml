# NFS backup target. In Longhorn >=1.9 the legacy `backup-target` Setting
# is rejected ("not supported") — backup targets are now BackupTarget CRs.
# This `default` CR replaces the old Setting (Argo was looping on the
# rejected Setting every reconcile, spamming the webhook). The S3 offsite
# target lives in s3-backup-target.yaml.
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: nfs://192.168.50.77:/media/chris/node2-hdd
  pollInterval: 5m0s
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: default-replica-count
  namespace: longhorn-system
value: "2"
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: auto-snapshot
  namespace: longhorn-system
spec:
  cron: "0 */6 * * *"
  task: "snapshot"
  groups:
  - default
  retain: 8
  concurrency: 2
  labels:
    app: longhorn
    type: auto-snapshot
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: auto-backup
  namespace: longhorn-system
spec:
  cron: "0 3 * * 0"
  task: "backup"
  groups:
  - default
  retain: 4
  concurrency: 2
  labels:
    app: longhorn
    type: auto-backup
---
# Rebuild tuning for a cluster on wifi.
#
# The defaults assume a wired network. On this one - 13-72ms with heavy
# jitter - rebuilding node1's replicas failed and restarted repeatedly: 26
# starts, 10 completions, 9 failures in one 20-minute sample. A rebuild
# that trips a timeout begins again from zero, so the same data crossed
# the link several times and loki-storage reached "failed to rebuild too
# many times".
#
# Worth being precise about what these measure, because it changes which
# one is doing the work. Both timeouts are IDLE/per-request, not deadlines
# on the whole transfer: engine-replica-timeout is time since the last
# response and only counts while I/O is outstanding, and the file-sync one
# bounds a single request. A rebuild that is actively moving data does not
# trip either - which is the right design, and means "it is taking hours"
# was never the thing failing.
#
# What failed was contention. Five rebuilds sharing one wifi link meant
# individual requests stalled past their budget, and a tripped timeout
# discards everything that rebuild had copied. So the concurrency limit
# below is the actual fix; the two timeouts are a cushion for jitter
# spikes, not the cure.
#
# Revisit if the nodes are ever wired: shorter timeouts detect a genuinely
# dead replica sooner, which is the better trade on a link that does not
# stall.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: engine-replica-timeout
  namespace: longhorn-system
# 30s, the maximum Longhorn allows, up from 8. Time since the last
# response, counted only while I/O is outstanding - so this is the margin
# for a jitter spike, not a budget for the rebuild.
value: "30"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-file-sync-http-client-timeout
  namespace: longhorn-system
# 120s, up from 30. Bounds a single sync request. A request that stalls
# past it fails the rebuild, which then restarts from zero - so the cost
# of being too strict is everything already copied.
value: "120"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-replica-rebuild-per-node-limit
  namespace: longhorn-system
# 1, down from 5. This is the fix. Five rebuilds sharing one wifi link
# meant each got a fifth of the bandwidth, so individual requests stalled
# past their per-request budget - and a failed rebuild discards everything
# it had copied. One at a time is slower in theory and finishes in
# practice.
value: "1"
