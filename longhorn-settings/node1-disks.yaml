# node1's Longhorn disks. Both are declared here: the 30%-of-disk reserve
# Longhorn defaults to on the root disk was live but undeclared until
# 2026-09-17, so `kubectl` and git disagreed and nothing said so.
#
# 40Gi on the root disk, down from the 134.6Gi default. node1 is headless
# - no desktop, no browser cache, no transcoding scratch - so the only
# non-Longhorn growth here is logs and container images. The default
# reserves 30% of the disk regardless of what the machine is for, which on
# a storage node is space that exists to be used.
# PAUSED 2026-09-17: allowScheduling false on both disks while node1 is on
# wifi. Rebuilding its replicas was failing and restarting - 26 starts, 10
# completions, 9 failures in one 20-minute sample - because a rebuild that
# stalls past its timeout begins again from zero, so the same data crossed
# the link repeatedly. loki-storage reached "failed to rebuild too many
# times".
#
# Nothing is offline while paused: every volume still serves from its
# healthy replica on node2 or pop-os. They stay degraded, and Longhorn's
# "volume not healthy" alert keeps firing, which is honest - they ARE a
# single copy.
#
# Set both back to true to resume. Prefer doing that with node1 on
# ethernet: 40GiB is minutes wired and hours over wifi, and the
# failure-restart loop is what wifi causes.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: node1
  namespace: longhorn-system
spec:
  disks:
    # Declared as the exact existing disk name so this updates in place
    # (ServerSideApply; do not introduce a second disk).
    default-disk-7a3e185305ffcb16:
      allowScheduling: false
      evictionRequested: false
      diskDriver: ""
      diskType: filesystem
      path: /var/lib/longhorn/
      storageReserved: 42949672960
      tags: []
    hdd:
      allowScheduling: false
      diskDriver: ""
      diskType: filesystem
      evictionRequested: false
      path: /media/chris/hdd/longhorn/
      storageReserved: 0
      tags:
        - hdd
